<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Planning annuel collaboratif de l'équipe infirmière.">
<meta name="theme-color" content="#F6F8F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relève">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Relève</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F6F8F7;
    --surface: #FFFFFF;
    --surface-2: #EFF3F2;
    --ink: #1B2A28;
    --muted: #5C6F6C;
    --line: #DCE4E2;
    --line-strong: #C3CFCC;
    --accent: #0E6E66;
    --accent-soft: #DCEBE9;
    --accent-ink: #FFFFFF;
    --weekend: #EDF1EF;
    --holiday: #F3E9E2;
    --danger: #A33B2E;

    --s-T-bg:   #C7E7DA; --s-T-ink:   #0F5844;
    --s-R-bg:   #E4E9E8; --s-R-ink:   #5A6462;
    --s-RAT-bg: #FAD9C2; --s-RAT-ink: #8A3B12;
    --s-RAT-ring: #C9682F;
    --s-RB-bg:  #D3DAF7; --s-RB-ink:  #333F91;

    --s-T-solid: #4FA791; --s-R-solid: #B7C3C0;
    --s-RAT-solid: #D9762F; --s-RB-solid: #7C88D8;

    --shadow: 0 1px 2px rgba(27, 42, 40, .06), 0 4px 14px rgba(27, 42, 40, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101615;
      --surface: #182120;
      --surface-2: #1E2A28;
      --ink: #E5EDEB;
      --muted: #92A5A1;
      --line: #2A3735;
      --line-strong: #3A4A47;
      --accent: #45B3A8;
      --accent-soft: #1C3532;
      --accent-ink: #06201D;
      --weekend: #1A2422;
      --holiday: #2A211C;
      --danger: #E08578;

      --s-T-bg:   #1C4038; --s-T-ink:   #98D9C3;
      --s-R-bg:   #262F2E; --s-R-ink:   #A6B4B1;
      --s-RAT-bg: #4B2A16; --s-RAT-ink: #F3B189;
      --s-RAT-ring: #C97A45;
      --s-RB-bg:  #2A3059; --s-RB-ink:  #B9C1F5;

      --s-T-solid: #3E8F7C; --s-R-solid: #566360;
      --s-RAT-solid: #C4712F; --s-RB-solid: #5D69B8;

      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101615;
    --surface: #182120;
    --surface-2: #1E2A28;
    --ink: #E5EDEB;
    --muted: #92A5A1;
    --line: #2A3735;
    --line-strong: #3A4A47;
    --accent: #45B3A8;
    --accent-soft: #1C3532;
    --accent-ink: #06201D;
    --weekend: #1A2422;
    --holiday: #2A211C;
    --danger: #E08578;

    --s-T-bg:   #1C4038; --s-T-ink:   #98D9C3;
    --s-R-bg:   #262F2E; --s-R-ink:   #A6B4B1;
    --s-RAT-bg: #4B2A16; --s-RAT-ink: #F3B189;
    --s-RAT-ring: #C97A45;
    --s-RB-bg:  #2A3059; --s-RB-ink:  #B9C1F5;

    --s-T-solid: #3E8F7C; --s-R-solid: #566360;
    --s-RAT-solid: #C4712F; --s-RB-solid: #5D69B8;

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 56px; }

  header.top {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 6px 0 14px;
  }
  .wordmark {
    font-family: "Bricolage Grotesque", "Figtree", sans-serif;
    font-weight: 700; font-size: 26px; letter-spacing: -0.01em;
    display: flex; align-items: baseline; gap: 10px;
  }
  .wordmark .tag {
    font-family: "Figtree", sans-serif; font-weight: 500; font-size: 13px;
    color: var(--muted); letter-spacing: 0;
  }
  .spacer { flex: 1; }

  /* Sélecteur de vue */
  .viewswitch {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px; gap: 2px;
  }
  .viewswitch button {
    border: none; background: transparent; border-radius: 8px;
    padding: 6px 15px; font-size: 13.5px; font-weight: 600; color: var(--muted);
  }
  .viewswitch button:hover { color: var(--ink); }
  .viewswitch button.on {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.10); font-weight: 700;
  }

  .periodnav { display: flex; align-items: center; gap: 4px; }
  .periodnav .label {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 600;
    font-size: 17px; min-width: 148px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .iconbtn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; padding: 0; flex: none;
  }
  .iconbtn:hover { border-color: var(--line-strong); }
  .todaybtn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .todaybtn:hover { border-color: var(--accent); color: var(--accent); }

  .savezone { display: flex; align-items: center; gap: 10px; }
  #save-status { font-size: 13px; color: var(--muted); }
  #save-status.dirty { color: var(--danger); font-weight: 600; }
  #save-btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 9px; padding: 8px 18px; font-weight: 700; font-size: 14px;
  }
  #save-btn:disabled { opacity: .45; cursor: default; }

  .months { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
  .months button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .months button:hover { border-color: var(--line-strong); color: var(--ink); }
  .months button.on {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .months button .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: .55; margin-left: 5px; vertical-align: 2px;
  }
  .months[hidden] { display: none; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .control-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #palette, #identity-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .control-label {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin-right: 2px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 13px; font-size: 13.5px; font-weight: 600;
  }
  .chip:hover { border-color: var(--line-strong); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); }
  .chip .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.tool { padding: 5px 12px 5px 6px; }
  .chip.tool .code {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 22px; border-radius: 7px; font-size: 11.5px; font-weight: 700;
    padding: 0 5px; flex: none;
  }
  .chip.ghost { border-style: dashed; color: var(--muted); background: transparent; }

  /* Pastilles de statut */
  .s-T   { background: var(--s-T-bg);   color: var(--s-T-ink); }
  .s-R   { background: var(--s-R-bg);   color: var(--s-R-ink); }
  .s-RAT { background: var(--s-RAT-bg); color: var(--s-RAT-ink);
           box-shadow: inset 0 0 0 1.5px var(--s-RAT-ring); }
  .s-RB  { background: var(--s-RB-bg);  color: var(--s-RB-ink); }

  .gridcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px;
  }
  .gridscroll { overflow-x: auto; }
  .empty-hint { padding: 34px 24px; text-align: center; color: var(--muted); font-size: 14.5px; }
  .hint-inline { padding: 10px 16px 12px; font-size: 12.5px; color: var(--muted); }

  /* ---------- vue mois, grand écran : jours en colonnes ---------- */

  table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  table.grid th, table.grid td { border-bottom: 1px solid var(--line); }
  table.grid thead th {
    font-size: 11px; font-weight: 600; color: var(--muted); text-align: center;
    padding: 6px 0 5px; min-width: 34px; background: var(--surface);
    border-left: 1px solid var(--line); user-select: none;
    font-variant-numeric: tabular-nums;
  }
  table.grid thead th .dow { display: block; font-size: 9.5px; letter-spacing: .04em; opacity: .8; }
  table.grid thead th .num { display: block; font-size: 12.5px; color: var(--ink); font-weight: 700; }
  table.grid thead th.we { background: var(--weekend); }
  table.grid thead th.hol { background: var(--holiday); }
  table.grid thead th.hol .num::after { content: "•"; color: var(--danger); margin-left: 2px; }
  table.grid thead th.today .num {
    color: var(--accent);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px;
  }
  th.namecol, td.namecol {
    position: sticky; left: 0; z-index: 2; background: var(--surface);
    text-align: left; padding: 0 14px; min-width: 150px; max-width: 210px;
    border-right: 1px solid var(--line-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  td.namecol { font-weight: 600; font-size: 13.5px; height: 40px; }
  td.namecol .swatch {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px;
  }
  tr.merow td.namecol { color: var(--accent); }
  tr.merow td.namecol::after { content: " · moi"; font-weight: 500; font-size: 11px; color: var(--muted); }
  table.grid td.cell {
    text-align: center; min-width: 34px; height: 40px; padding: 0;
    border-left: 1px solid var(--line); font-size: 11.5px; font-weight: 700;
  }
  td.cell {
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  td.cell.we { background: var(--weekend); }
  td.cell.hol { background: var(--holiday); }
  td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.cell span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 26px; border-radius: 7px; padding: 0 4px;
  }

  /* ---------- vue mois, petit écran : jours en lignes ---------- */

  table.mgrid { width: 100%; border-collapse: separate; border-spacing: 0; }
  table.mgrid thead th {
    position: sticky; top: var(--stick, 0px); z-index: 3; background: var(--surface);
    border-bottom: 1px solid var(--line-strong);
    font-size: 12.5px; font-weight: 700; padding: 9px 4px; text-align: center;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.mgrid thead th.mcorner {
    text-align: left; padding-left: 13px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  }
  table.mgrid thead th.mine { color: var(--accent); }
  table.mgrid thead th .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
  }
  table.mgrid th.mday {
    text-align: left; padding: 0 6px 0 13px; width: 78px; font-size: 14px; font-weight: 600;
    white-space: nowrap; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--line);
  }
  table.mgrid th.mday .dw { color: var(--muted); font-weight: 500; margin-right: 5px; }
  table.mgrid td.cell { height: 48px; text-align: center; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
  table.mgrid td.cell span { min-width: 36px; height: 32px; font-size: 13px; border-radius: 9px; }
  table.mgrid tr.we th.mday, table.mgrid tr.we td.cell { background: var(--weekend); }
  table.mgrid tr.hol th.mday, table.mgrid tr.hol td.cell { background: var(--holiday); }
  table.mgrid tr.hol th.mday::after { content: " •"; color: var(--danger); }
  table.mgrid tr.today th.mday { color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  table.mgrid tr:last-child th.mday, table.mgrid tr:last-child td.cell { border-bottom: none; }

  /* ---------- vue semaine ---------- */

  table.wgrid { width: 100%; border-collapse: separate; border-spacing: 0; }
  table.wgrid thead th {
    background: var(--surface); border-bottom: 1px solid var(--line-strong);
    font-size: 13px; font-weight: 700; padding: 10px 6px; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.wgrid thead th.wcorner {
    text-align: left; padding-left: 16px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  table.wgrid thead th.mine { color: var(--accent); }
  table.wgrid thead th .swatch {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
  }
  table.wgrid th.wday {
    text-align: left; padding: 0 8px 0 16px; width: 168px;
    font-size: 15px; font-weight: 600; white-space: nowrap;
    border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  table.wgrid th.wday .dw { color: var(--muted); font-weight: 500; }
  table.wgrid th.wday .dm { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 4px; }
  table.wgrid td.cell {
    height: 62px; text-align: center;
    border-bottom: 1px solid var(--line); border-left: 1px solid var(--line);
  }
  table.wgrid td.cell span {
    min-width: 78px; height: 38px; border-radius: 10px; font-size: 13.5px; font-weight: 700;
  }
  table.wgrid tr.we th.wday, table.wgrid tr.we td.cell { background: var(--weekend); }
  table.wgrid tr.hol th.wday, table.wgrid tr.hol td.cell { background: var(--holiday); }
  table.wgrid tr.hol th.wday::after { content: " • férié"; color: var(--danger); font-size: 11.5px; font-weight: 600; }
  table.wgrid tr.today th.wday { color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  table.wgrid tr:last-child th.wday, table.wgrid tr:last-child td.cell { border-bottom: none; }

  /* ---------- vue année : douze calendriers mensuels ---------- */

  .yearbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  .yearbar .control-label { margin-right: 0; }

  .ycal {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 22px 24px; padding: 18px 16px 6px;
  }
  .ymcard { min-width: 0; }
  .ymtitle {
    display: block; width: 100%; background: none; border: none;
    text-align: center; padding: 0 0 8px;
    font-family: "Bricolage Grotesque", "Figtree", sans-serif;
    font-size: 15px; font-weight: 600; color: var(--ink);
    border-radius: 6px;
  }
  .ymtitle:hover { color: var(--accent); }
  .ymtitle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  table.ycalt { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.ycalt thead th {
    font-size: 10px; font-weight: 600; color: var(--muted);
    padding-bottom: 5px; text-align: center; font-variant-numeric: tabular-nums;
  }
  table.ycalt thead th.wend { color: var(--line-strong); }
  table.ycalt td {
    padding: 1px 2px 4px; text-align: center; vertical-align: top;
  }
  table.ycalt td.cell { cursor: pointer; }
  table.ycalt td b {
    display: block; font-size: 12px; font-weight: 500; line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  table.ycalt td i {
    display: block; height: 3px; border-radius: 2px; margin-top: 1px;
    background: transparent; font-style: normal;
  }
  table.ycalt td.out { cursor: default; }
  table.ycalt td.out b { color: var(--line-strong); font-weight: 400; }
  table.ycalt td.out i { opacity: .3; }
  table.ycalt td.hol b { color: var(--danger); }
  table.ycalt td.today b {
    color: var(--accent-ink); background: var(--accent); font-weight: 700;
    border-radius: 50%; width: 19px; height: 19px; line-height: 19px; margin: 0 auto;
  }
  table.ycalt td.cell:hover b { color: var(--accent); }
  table.ycalt td.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 4px; }
  table.ycalt td i.s-T   { background: var(--s-T-solid); }
  table.ycalt td i.s-R   { background: var(--s-R-solid); }
  table.ycalt td i.s-RAT { background: var(--s-RAT-solid); }
  table.ycalt td i.s-RB  { background: var(--s-RB-solid); }

  .ylegend {
    display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 16px 14px;
    font-size: 12px; color: var(--muted);
  }
  .ylegend span { display: inline-flex; align-items: center; gap: 7px; }
  .ylegend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; font-style: normal; }
  .ylegend i.s-T   { background: var(--s-T-solid); }
  .ylegend i.s-R   { background: var(--s-R-solid); }
  .ylegend i.s-RAT { background: var(--s-RAT-solid); }
  .ylegend i.s-RB  { background: var(--s-RB-solid); }

  @media (max-width: 1080px) { .ycal { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px)  { .ycal { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 330px)  { .ycal { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- récapitulatifs ---------- */

  details.panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  details.panel > summary {
    cursor: pointer; padding: 11px 16px; font-weight: 700; font-size: 14px;
    list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::before { content: "▸"; font-size: 11px; color: var(--muted); transition: transform .15s; }
  details.panel[open] > summary::before { transform: rotate(90deg); }
  details.panel .panel-body { padding: 2px 16px 16px; }

  table.sum { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.sum th, table.sum td {
    padding: 6px 10px; font-size: 13px; text-align: center; border-bottom: 1px solid var(--line);
  }
  table.sum th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
  table.sum td:first-child, table.sum th:first-child { text-align: left; font-weight: 600; }
  table.sum td.zero { color: var(--muted); opacity: .45; }
  table.sum td.alert { color: var(--s-RAT-ink); font-weight: 700; }
  .sumscroll { overflow-x: auto; }

  .teamlist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .teamrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .teamrow input[type="text"] {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font-size: 14px; width: 200px;
  }
  .teamrow input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .colorpick { display: flex; gap: 5px; }
  .colorpick button {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0;
  }
  .colorpick button.on { border-color: var(--ink); }
  .del {
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    color: var(--danger); font-size: 12.5px; font-weight: 600; padding: 5px 10px;
  }
  .del:hover { border-color: var(--danger); }
  .addbtn {
    background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px;
    padding: 7px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted);
  }
  .addbtn:hover { color: var(--ink); border-color: var(--accent); }

  .banner {
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px;
    padding: 10px 16px; font-size: 13.5px; margin-bottom: 14px; display: none;
  }
  .banner.show { display: block; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 18px;
    font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .install-hint {
    font-size: 12.5px; color: var(--muted); padding: 10px 14px 0; text-align: center;
  }
  @media (display-mode: standalone) { .install-hint { display: none !important; } }

  /* ---------- petits écrans ---------- */

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .wrap {
      padding: 0 0 calc(28px + env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* En-tête compact : deux lignes seulement, le nom de l'app passe dans
       l'onglet ou l'icône de l'écran d'accueil. */
    header.top {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg); border-bottom: 1px solid var(--line);
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      gap: 8px; flex-wrap: wrap;
    }
    .wordmark, .spacer { display: none; }

    .viewswitch { order: 1; flex: 1 1 auto; }
    .viewswitch button { flex: 1; padding: 8px 6px; font-size: 14px; }
    .savezone { order: 2; margin-left: auto; gap: 8px; }
    #save-status { font-size: 12.5px; }
    #save-btn { padding: 8px 14px; font-size: 13.5px; }
    #save-btn:disabled { display: none; }

    .periodnav { order: 3; width: 100%; gap: 6px; }
    .periodnav .label { flex: 1; min-width: 0; font-size: 16px; }
    .iconbtn { width: 36px; height: 36px; }
    .todaybtn { padding: 8px 12px; white-space: nowrap; }

    .months {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      gap: 6px; margin: 0; padding: 10px 14px; -webkit-overflow-scrolling: touch;
    }
    .months::-webkit-scrollbar { display: none; }
    .months button { flex: none; padding: 8px 14px; font-size: 14px; }

    .controls {
      border-radius: 0; border-left: none; border-right: none;
      box-shadow: none; padding: 10px 0 12px; margin-bottom: 0; gap: 8px 0;
      flex-direction: column; align-items: stretch;
    }
    .control-group {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      gap: 7px; padding: 0 14px; -webkit-overflow-scrolling: touch;
    }
    .control-group::-webkit-scrollbar { display: none; }
    .control-label { position: sticky; left: 0; background: var(--surface); padding-right: 4px; z-index: 1; }
    .chip { flex: none; padding: 10px 15px; font-size: 14.5px; min-height: 42px; }
    .chip.tool { padding: 8px 14px 8px 8px; }
    #palette, #identity-chips { flex-wrap: nowrap; }

    .gridcard {
      border-radius: 0; border-left: none; border-right: none;
      box-shadow: none; margin-bottom: 14px;
      overflow: visible; /* sinon l'en-tête collant du tableau ne tient pas */
    }
    .gridscroll { overflow-x: auto; }

    table.wgrid th.wday { width: 128px; font-size: 14px; padding-left: 13px; }
    table.wgrid td.cell { height: 56px; }
    table.wgrid td.cell span { min-width: 64px; height: 34px; font-size: 12.5px; }

    .yearbar { padding: 10px 14px; }
    .ycal { gap: 18px 14px; padding: 14px 12px 4px; }
    .ymtitle { font-size: 14px; padding-bottom: 6px; }
    table.ycalt thead th { font-size: 9px; }
    table.ycalt td b { font-size: 11.5px; }
    table.ycalt td.today b { width: 18px; height: 18px; line-height: 18px; }
    .ylegend { padding: 8px 14px 12px; gap: 12px; font-size: 11.5px; }

    details.panel {
      border-radius: 0; border-left: none; border-right: none;
      box-shadow: none; margin-bottom: 0; border-top: none;
    }
    details.panel > summary { padding: 14px; font-size: 15px; }
    details.panel .panel-body { padding: 0 14px 16px; }

    .banner { border-radius: 0; border-left: none; border-right: none; margin-bottom: 0; }

    .teamrow input[type="text"] { width: 100%; flex: 1 1 140px; }
    .colorpick button { width: 26px; height: 26px; }
    .del, .addbtn { padding: 9px 14px; }

    #toast { bottom: calc(20px + env(safe-area-inset-bottom)); }
  }

  @media (max-width: 380px) {
    table.mgrid th.mday { width: 68px; font-size: 13px; padding-left: 10px; }
    table.mgrid td.cell span { min-width: 32px; }
    table.wgrid th.wday { width: 108px; font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #toast, details.panel > summary::before { transition: none; }
  }
</style>

<body>
<script src="config.js"></script>

<!--RELEVE-STATE-->
<script type="application/json" id="app-state">{"v":2,"team":[],"entries":{},"seeds":[]}</script>
<!--/RELEVE-STATE-->

<div class="wrap">

        <input type="text" id="add-name" placeholder="Prénom de l'infirmière" aria-label="Prénom de l'infirmière">

      </div>

</div>

<div id="toast" role="status"></div>
<script>
(function () {
  "use strict";

  /* ---------- statuts ---------- */

  var TYPES = [
    { id: "T",   label: "Travail",          glyph: "T",  short: "Travail" },
    { id: "R",   label: "Repos",            glyph: "R",  short: "Repos" },
    { id: "RAT", label: "Rempla à trouver", glyph: "?",  short: "À trouver" },
    { id: "RB",  label: "Rempla booké",     glyph: "RB", short: "Booké" }
  ];
  var WORKED = { T: 1 };            // seul « Travail » compte comme jour travaillé
  var NEEDS_COVER = { RAT: 1 };     // jours à couvrir : mis en avant dans les récaps

  /* ---------- état ---------- */

  var STATE_EL_ID = "app-state";
  var state = { v: 2, team: [], entries: {}, seeds: [] };
  try {
    state = JSON.parse(document.getElementById(STATE_EL_ID).textContent);
  } catch (e) { /* état illisible : on repart d'une base vide */ }

  function normalizeState() {
    state.team = state.team || [];
    state.entries = state.entries || {};
    state.seeds = state.seeds || [];
    state.types = TYPES;            // la liste des statuts est fixée par l'application
    state.v = 2;
  }
  normalizeState();

  var NURSE_COLORS = ["#0E6E66", "#B85C38", "#5B6FB5", "#8A5BA0", "#3E7CB1", "#C2803A", "#6E8F4B", "#A64D6D"];
  var MONTHS = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin",
    "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
  var MONTHS_SHORT = ["Janv.", "Févr.", "Mars", "Avr.", "Mai", "Juin",
    "Juil.", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
  var DOW = ["D", "L", "M", "M", "J", "V", "S"];
  var DOW_SHORT = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
  var DOW_LONG = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];

  var now = new Date();
  var curYear = now.getFullYear();
  var curMonth = now.getMonth();
  var weekStart = mondayOf(now);
  var view = "month";
  var brush = "T";
  var dirty = false;
  var saving = false;
  var readOnly = false;
  var painting = false;
  var me = null;
  var yearWho = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) { } }

  me = lsGet("releve.me");
  if (me && !state.team.some(function (n) { return n.id === me; })) me = null;
  var savedView = lsGet("releve.view");
  if (savedView === "year" || savedView === "week" || savedView === "month") view = savedView;

  /* Modifications en attente : rejouées après un rechargement ou par-dessus une
     version plus récente du serveur, pour ne jamais perdre ce qui vient d'être saisi. */
  var PENDING_KEY = "releve.pending";
  var pending = {};

  function applyPendingToState() {
    var changed = false;
    Object.keys(pending).forEach(function (key) {
      var parts = key.split("|");
      var nid = parts[0], date = parts[1], val = pending[key];
      if (!state.team.some(function (n) { return n.id === nid; })) return;
      var cur = (state.entries[nid] || {})[date] || null;
      if (cur === val) return;
      if (!state.entries[nid]) state.entries[nid] = {};
      if (val === null) delete state.entries[nid][date];
      else state.entries[nid][date] = val;
      changed = true;
    });
    return changed;
  }

  (function restorePending() {
    var raw = ssGet(PENDING_KEY);
    if (!raw) return;
    try { pending = JSON.parse(raw) || {}; } catch (e) { pending = {}; ssDel(PENDING_KEY); return; }
    if (applyPendingToState()) { dirty = true; }
    else { pending = {}; ssDel(PENDING_KEY); }
  })();

  /* ---------- jours fériés (France métropolitaine) ---------- */

  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31);
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  var holidayCache = {};
  function holidays(y) {
    if (holidayCache[y]) return holidayCache[y];
    var set = {};
    [[0, 1], [4, 1], [4, 8], [6, 14], [7, 15], [10, 1], [10, 11], [11, 25]]
      .forEach(function (md) { set[fmt(y, md[0], md[1])] = true; });
    var p = easter(y);
    [1, 39, 50].forEach(function (off) {
      var d = new Date(p.getFullYear(), p.getMonth(), p.getDate() + off);
      set[fmt(d.getFullYear(), d.getMonth(), d.getDate())] = true;
    });
    holidayCache[y] = set;
    return set;
  }

  /* ---------- utilitaires ---------- */

  function fmt(y, m, d) {
    return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function mondayOf(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }
  function addDays(date, n) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
  }
  function typeById(id) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return TYPES[i];
    return null;
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function uid() { return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayStr() { return fmt(now.getFullYear(), now.getMonth(), now.getDate()); }
  function entryOf(nid, dstr) { return (state.entries[nid] || {})[dstr] || null; }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }

  /* ---------- passage aux quatre statuts ---------- */

  /* Les anciens codes (Matin, Soir, Nuit, Journée, Formation, Congés) sont
     convertis une seule fois vers Travail / Repos. */
  var STATUS_MIGRATION = {
    id: "statuts-v2",
    map: { M: "T", S: "T", N: "T", J: "T", F: "T", CA: "R", R: "R", T: "T", RAT: "RAT", RB: "RB" }
  };

  function migrateStatuses() {
    if (state.seeds.indexOf(STATUS_MIGRATION.id) >= 0) return false;
    Object.keys(state.entries).forEach(function (nid) {
      var days = state.entries[nid];
      Object.keys(days).forEach(function (d) {
        var to = STATUS_MIGRATION.map[days[d]];
        if (to) days[d] = to;
        else delete days[d];
      });
    });
    state.seeds.push(STATUS_MIGRATION.id);
    return true;
  }

  /* ---------- roulement pré-rempli ---------- */

  /* Roulement de deux semaines entre deux personnes, qui couvre tous les jours
     de l'année : semaine A = lundi, mardi, vendredi, samedi, dimanche ;
     semaine B = mercredi, jeudi ; les deux s'échangent chaque semaine.
     Axelle commence en semaine A, ce qui la place au travail le 1er janvier
     2027 (un vendredi). Appliqué une seule fois. */
  var SEED = {
    id: "roulement-2027",
    year: 2027,
    anchorDay: Math.floor(Date.UTC(2026, 11, 28) / 86400000), // lundi de la semaine du 1er janvier 2027
    weekA: [0, 1, 4, 5, 6], // 0 = lundi
    nurses: [
      { name: "Axelle", color: "#0E6E66", phase: 0 },
      { name: "Collègue", color: "#B85C38", phase: 1 }
    ],
    work: "T",
    rest: "R"
  };

  function applySeed() {
    if (state.seeds.indexOf(SEED.id) >= 0) return false;
    var ids = SEED.nurses.map(function (s) {
      var found = null;
      for (var i = 0; i < state.team.length; i++) {
        if (state.team[i].name.trim().toLowerCase() === s.name.toLowerCase()) { found = state.team[i]; break; }
      }
      if (!found) {
        found = { id: uid(), name: s.name, color: s.color };
        state.team.push(found);
      }
      if (!state.entries[found.id]) state.entries[found.id] = {};
      return found.id;
    });
    for (var m = 0; m < 12; m++) {
      var nd = daysInMonth(SEED.year, m);
      for (var d = 1; d <= nd; d++) {
        var dstr = fmt(SEED.year, m, d);
        var week = Math.floor((Math.floor(Date.UTC(SEED.year, m, d) / 86400000) - SEED.anchorDay) / 7);
        var inA = SEED.weekA.indexOf((new Date(SEED.year, m, d).getDay() + 6) % 7) >= 0;
        for (var i = 0; i < SEED.nurses.length; i++) {
          var weekIsA = ((week + SEED.nurses[i].phase) % 2) === 0;
          state.entries[ids[i]][dstr] = (weekIsA ? inA : !inA) ? SEED.work : SEED.rest;
        }
      }
    }
    state.seeds.push(SEED.id);
    return true;
  }

  function yearHasEntries(y) {
    var ids = Object.keys(state.entries);
    for (var i = 0; i < ids.length; i++) {
      var ds = Object.keys(state.entries[ids[i]]);
      for (var j = 0; j < ds.length; j++) if (ds[j].indexOf(y + "-") === 0) return true;
    }
    return false;
  }

  /* Ouvrir directement sur une année qui contient un planning. */
  function pickInitialYear() {
    if (yearHasEntries(curYear)) return;
    if (!yearHasEntries(SEED.year)) return;
    curYear = SEED.year;
    curMonth = 0;
    weekStart = mondayOf(new Date(SEED.year, 0, 1));
  }

  /* ---------- rendu : entêtes et contrôles ---------- */

  var narrow = window.matchMedia("(max-width: 760px)");

  var VIEWS = [
    { id: "year", label: "Année" },
    { id: "month", label: "Mois" },
    { id: "week", label: "Semaine" }
  ];

  function renderViewSwitch() {
    var box = document.getElementById("viewswitch");
    box.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button", view === v.id ? "on" : "", v.label);
      b.setAttribute("aria-pressed", view === v.id ? "true" : "false");
      b.addEventListener("click", function () { setView(v.id); });
      box.appendChild(b);
    });
  }

  function setView(next) {
    if (view === next) return;
    // Garder la période cohérente d'une vue à l'autre.
    if (next === "week") {
      var inMonth = weekStart.getFullYear() === curYear && weekStart.getMonth() === curMonth;
      if (!inMonth) {
        var day = (curYear === now.getFullYear() && curMonth === now.getMonth()) ? now.getDate() : 1;
        weekStart = mondayOf(new Date(curYear, curMonth, day));
      }
    } else if (view === "week") {
      curYear = weekStart.getFullYear();
      curMonth = weekStart.getMonth();
    }
    view = next;
    lsSet("releve.view", view);
    renderAll();
  }

  function periodLabel() {
    if (view === "year") return String(curYear);
    if (view === "month") return MONTHS[curMonth] + " " + curYear;
    var end = addDays(weekStart, 6);
    var a = weekStart.getDate(), b = end.getDate();
    if (weekStart.getMonth() === end.getMonth()) {
      return a + " – " + b + " " + MONTHS_SHORT[end.getMonth()].toLowerCase() + " " + end.getFullYear();
    }
    return a + " " + MONTHS_SHORT[weekStart.getMonth()].toLowerCase() + " – " +
      b + " " + MONTHS_SHORT[end.getMonth()].toLowerCase() + " " + end.getFullYear();
  }

  function renderPeriod() {
    document.getElementById("period-label").textContent = periodLabel();
    document.getElementById("months").hidden = view !== "month";
  }

  function shiftPeriod(dir) {
    if (view === "year") curYear += dir;
    else if (view === "month") {
      curMonth += dir;
      if (curMonth > 11) { curMonth = 0; curYear++; }
      if (curMonth < 0) { curMonth = 11; curYear--; }
    } else {
      weekStart = addDays(weekStart, 7 * dir);
      curYear = weekStart.getFullYear();
      curMonth = weekStart.getMonth();
    }
    renderAll();
  }

  function goToday() {
    curYear = now.getFullYear();
    curMonth = now.getMonth();
    weekStart = mondayOf(now);
    renderAll();
  }

  function monthHasEntries(y, m) {
    var prefix = y + "-" + String(m + 1).padStart(2, "0");
    var ids = Object.keys(state.entries);
    for (var i = 0; i < ids.length; i++) {
      var dates = Object.keys(state.entries[ids[i]]);
      for (var j = 0; j < dates.length; j++) if (dates[j].indexOf(prefix) === 0) return true;
    }
    return false;
  }

  function renderMonths() {
    var nav = document.getElementById("months");
    nav.textContent = "";
    for (var m = 0; m < 12; m++) {
      (function (m) {
        var b = el("button", m === curMonth ? "on" : "", MONTHS_SHORT[m]);
        if (monthHasEntries(curYear, m)) b.appendChild(el("span", "dot"));
        b.addEventListener("click", function () { curMonth = m; renderAll(); });
        nav.appendChild(b);
      })(m);
    }
    var on = nav.querySelector("button.on");
    if (on && nav.scrollWidth > nav.clientWidth) {
      nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.offsetWidth / 2, behavior: "auto" });
    }
  }

  function renderIdentity() {
    var box = document.getElementById("identity-chips");
    box.textContent = "";
    if (!state.team.length) {
      box.appendChild(el("span", "chip ghost", "ajoutez l'équipe ci-dessous"));
      return;
    }
    state.team.forEach(function (n) {
      var c = el("button", "chip" + (me === n.id ? " on" : ""));
      var sw = el("span", "swatch");
      sw.style.background = n.color;
      c.appendChild(sw);
      c.appendChild(document.createTextNode(n.name));
      c.addEventListener("click", function () {
        me = (me === n.id) ? null : n.id;
        lsSet("releve.me", me || "");
        if (me) yearWho = me;
        renderIdentity();
        renderGrid();
      });
      box.appendChild(c);
    });
  }

  function renderPalette() {
    var box = document.getElementById("palette");
    box.textContent = "";
    TYPES.forEach(function (t) {
      var c = el("button", "chip tool" + (brush === t.id ? " on" : ""));
      c.appendChild(el("span", "code s-" + t.id, t.glyph));
      c.appendChild(document.createTextNode(t.label));
      c.addEventListener("click", function () { brush = t.id; renderPalette(); });
      box.appendChild(c);
    });
    var er = el("button", "chip tool" + (brush === "ERASE" ? " on" : ""), "✕ Effacer");
    er.addEventListener("click", function () { brush = "ERASE"; renderPalette(); });
    box.appendChild(er);
  }

  /* ---------- rendu : grille ---------- */

  function makeCell(nid, dstr, extraCls) {
    var td = el("td", "cell" + (extraCls ? " " + extraCls : ""));
    td.dataset.n = nid;
    td.dataset.d = dstr;
    td.tabIndex = 0;
    paintCellContent(td);
    return td;
  }

  function paintCellContent(td) {
    var code = entryOf(td.dataset.n, td.dataset.d);
    var t = code ? typeById(code) : null;
    if (td.dataset.cal === "1") {
      var bar = td.querySelector("i");
      if (!bar) { bar = el("i"); td.appendChild(bar); }
      bar.className = t ? "s-" + code : "";
      td.title = t ? t.label : "";
      return;
    }
    td.textContent = "";
    if (t) {
      var s = el("span", "s-" + code, td.dataset.full === "1" ? t.label : t.glyph);
      s.title = t.label;
      td.appendChild(s);
    }
  }

  function renderGrid() {
    var top = document.getElementById("gridtop");
    var scroll = document.getElementById("gridscroll");
    var hint = document.getElementById("grid-hint");
    top.textContent = "";
    scroll.textContent = "";
    if (!state.team.length) {
      scroll.appendChild(el("div", "empty-hint",
        "Aucune infirmière pour l'instant. Ouvrez « Gérer l'équipe » en bas de page pour ajouter les membres, puis chacune pourra remplir ses jours."));
      hint.textContent = "";
      return;
    }
    if (view === "year") renderYear(top, scroll, hint);
    else if (view === "week") renderWeek(scroll, hint);
    else if (narrow.matches) renderMonthNarrow(scroll, hint);
    else renderMonthWide(scroll, hint);
  }

  /* Vue mois, grand écran : infirmières en lignes, jours en colonnes. */
  function renderMonthWide(scroll, hint) {
    var nd = daysInMonth(curYear, curMonth);
    var hols = holidays(curYear);
    var today = todayStr();

    var table = el("table", "grid");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "namecol", MONTHS[curMonth] + " " + curYear));
    for (var d = 1; d <= nd; d++) {
      var date = new Date(curYear, curMonth, d);
      var dstr = fmt(curYear, curMonth, d);
      var cls = [];
      if (date.getDay() === 0 || date.getDay() === 6) cls.push("we");
      if (hols[dstr]) cls.push("hol");
      if (dstr === today) cls.push("today");
      var th = el("th", cls.join(" "));
      th.appendChild(el("span", "dow", DOW[date.getDay()]));
      th.appendChild(el("span", "num", String(d)));
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    state.team.forEach(function (n) {
      var tr = el("tr", me === n.id ? "merow" : "");
      var nameTd = el("td", "namecol");
      var sw = el("span", "swatch");
      sw.style.background = n.color;
      nameTd.appendChild(sw);
      nameTd.appendChild(document.createTextNode(n.name));
      tr.appendChild(nameTd);
      for (var d = 1; d <= nd; d++) {
        var dstr = fmt(curYear, curMonth, d);
        var date = new Date(curYear, curMonth, d);
        var cls = [];
        if (date.getDay() === 0 || date.getDay() === 6) cls.push("we");
        if (hols[dstr]) cls.push("hol");
        tr.appendChild(makeCell(n.id, dstr, cls.join(" ")));
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    hint.textContent = "Choisissez un statut puis cliquez (ou glissez) sur les jours. Clic droit : effacer. Le point rouge marque les jours fériés.";
  }

  /* Vue mois, petit écran : jours en lignes, infirmières en colonnes. */
  function renderMonthNarrow(scroll, hint) {
    var nd = daysInMonth(curYear, curMonth);
    var hols = holidays(curYear);
    var today = todayStr();

    var table = el("table", "mgrid");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "mcorner", MONTHS_SHORT[curMonth] + " " + curYear));
    state.team.forEach(function (n) {
      var th = el("th", me === n.id ? "mine" : "");
      var sw = el("span", "swatch");
      sw.style.background = n.color;
      th.appendChild(sw);
      th.appendChild(document.createTextNode(n.name));
      th.title = n.name;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    for (var d = 1; d <= nd; d++) {
      var dstr = fmt(curYear, curMonth, d);
      var date = new Date(curYear, curMonth, d);
      var cls = [];
      if (date.getDay() === 0 || date.getDay() === 6) cls.push("we");
      if (hols[dstr]) cls.push("hol");
      if (dstr === today) cls.push("today");
      var tr = el("tr", cls.join(" "));
      var dayTh = el("th", "mday");
      dayTh.appendChild(el("span", "dw", DOW_SHORT[date.getDay()]));
      dayTh.appendChild(document.createTextNode(String(d)));
      tr.appendChild(dayTh);
      (function (dstr) {
        state.team.forEach(function (n) { tr.appendChild(makeCell(n.id, dstr)); });
      })(dstr);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    hint.textContent = "Choisissez un statut en haut, puis touchez les jours. « Effacer » retire un statut.";
  }

  /* Vue semaine : sept jours détaillés, infirmières en colonnes. */
  function renderWeek(scroll, hint) {
    var hols = holidays(weekStart.getFullYear());
    var holsEnd = holidays(addDays(weekStart, 6).getFullYear());
    var today = todayStr();

    var table = el("table", "wgrid");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "wcorner", "Semaine"));
    state.team.forEach(function (n) {
      var th = el("th", me === n.id ? "mine" : "");
      var sw = el("span", "swatch");
      sw.style.background = n.color;
      th.appendChild(sw);
      th.appendChild(document.createTextNode(n.name));
      th.title = n.name;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    for (var i = 0; i < 7; i++) {
      var date = addDays(weekStart, i);
      var dstr = fmt(date.getFullYear(), date.getMonth(), date.getDate());
      var isHol = hols[dstr] || holsEnd[dstr];
      var cls = [];
      if (date.getDay() === 0 || date.getDay() === 6) cls.push("we");
      if (isHol) cls.push("hol");
      if (dstr === today) cls.push("today");
      var tr = el("tr", cls.join(" "));
      var dayTh = el("th", "wday");
      dayTh.appendChild(el("span", "dw", DOW_LONG[date.getDay()] + " "));
      dayTh.appendChild(document.createTextNode(String(date.getDate())));
      dayTh.appendChild(el("span", "dm", MONTHS_SHORT[date.getMonth()].toLowerCase()));
      tr.appendChild(dayTh);
      (function (dstr) {
        state.team.forEach(function (n) {
          var td = makeCell(n.id, dstr);
          td.dataset.full = "1";
          paintCellContent(td);
          tr.appendChild(td);
        });
      })(dstr);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    hint.textContent = "Choisissez un statut puis touchez une case pour l'appliquer sur cette semaine.";
  }

  /* Vue année : douze calendriers mensuels, un trait de couleur sous chaque
     jour. Une infirmière à la fois, choisie par les onglets. */
  function renderYear(top, scroll, hint) {
    if (!yearWho || !state.team.some(function (n) { return n.id === yearWho; })) {
      yearWho = me || state.team[0].id;
    }
    var bar = el("div", "yearbar");
    bar.appendChild(el("span", "control-label", "Année de"));
    state.team.forEach(function (n) {
      var c = el("button", "chip" + (yearWho === n.id ? " on" : ""));
      var sw = el("span", "swatch");
      sw.style.background = n.color;
      c.appendChild(sw);
      c.appendChild(document.createTextNode(n.name));
      c.addEventListener("click", function () { yearWho = n.id; renderGrid(); });
      bar.appendChild(c);
    });
    top.appendChild(bar);

    var hols = holidays(curYear);
    var holsPrev = holidays(curYear - 1);
    var holsNext = holidays(curYear + 1);
    var today = todayStr();
    var cal = el("div", "ycal");

    for (var m = 0; m < 12; m++) {
      cal.appendChild(monthCard(m, hols, holsPrev, holsNext, today));
    }
    scroll.appendChild(cal);

    var legend = el("div", "ylegend");
    TYPES.forEach(function (t) {
      var s = el("span");
      s.appendChild(el("i", "s-" + t.id));
      s.appendChild(document.createTextNode(t.label));
      legend.appendChild(s);
    });
    scroll.appendChild(legend);
    hint.textContent = "Touchez un jour pour le modifier, ou le nom d'un mois pour l'ouvrir en détail.";
  }

  function dayIndex(date) {
    return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
  }

  function monthCard(m, hols, holsPrev, holsNext, today) {
    var card = el("div", "ymcard");
    var title = el("button", "ymtitle", MONTHS[m] + " " + curYear);
    title.title = "Ouvrir " + MONTHS[m] + " en détail";
    title.addEventListener("click", function () { curMonth = m; setView("month"); });
    card.appendChild(title);

    var table = el("table", "ycalt");
    var thead = el("thead");
    var hr = el("tr");
    ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."].forEach(function (d, i) {
      hr.appendChild(el("th", i >= 5 ? "wend" : null, d));
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var first = new Date(curYear, m, 1);
    var last = new Date(curYear, m, daysInMonth(curYear, m));
    var start = mondayOf(first);
    var weeks = Math.round((dayIndex(mondayOf(last)) - dayIndex(start)) / 7) + 1;

    var tbody = el("tbody");
    for (var w = 0; w < weeks; w++) {
      var tr = el("tr");
      for (var k = 0; k < 7; k++) {
        var date = addDays(start, w * 7 + k);
        var y = date.getFullYear(), mo = date.getMonth(), d = date.getDate();
        var dstr = fmt(y, mo, d);
        var inMonth = (mo === m && y === curYear);
        var holsFor = y < curYear ? holsPrev : (y > curYear ? holsNext : hols);
        var cls = [];
        if (!inMonth) cls.push("out");
        else {
          cls.push("cell");
          if (holsFor[dstr]) cls.push("hol");
          if (dstr === today) cls.push("today");
        }
        var td = el("td", cls.join(" "));
        td.appendChild(el("b", null, String(d)));
        td.appendChild(el("i"));
        td.dataset.cal = "1";
        if (inMonth) {
          td.dataset.n = yearWho;
          td.dataset.d = dstr;
          td.tabIndex = 0;
        } else {
          // Les jours du mois voisin restent visibles, en retrait et non modifiables.
          td.dataset.n = yearWho;
          td.dataset.d = dstr;
        }
        paintCellContent(td);
        if (!inMonth) { delete td.dataset.n; }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    card.appendChild(table);
    return card;
  }

  /* ---------- récapitulatifs ---------- */

  function countRange(nid, from, to) {
    var counts = { we: 0 };
    TYPES.forEach(function (t) { counts[t.id] = 0; });
    var entries = state.entries[nid] || {};
    Object.keys(entries).forEach(function (dstr) {
      if (dstr < from || dstr > to) return;
      var code = entries[dstr];
      if (counts[code] == null) return;
      counts[code]++;
      if (WORKED[code]) {
        var parts = dstr.split("-");
        var day = new Date(+parts[0], +parts[1] - 1, +parts[2]).getDay();
        if (day === 0 || day === 6) counts.we++;
      }
    });
    return counts;
  }

  function currentRange() {
    if (view === "year") {
      return { from: fmt(curYear, 0, 1), to: fmt(curYear, 11, 31), title: "Année " + curYear };
    }
    if (view === "month") {
      return {
        from: fmt(curYear, curMonth, 1),
        to: fmt(curYear, curMonth, daysInMonth(curYear, curMonth)),
        title: MONTHS[curMonth] + " " + curYear
      };
    }
    var end = addDays(weekStart, 6);
    return {
      from: fmt(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()),
      to: fmt(end.getFullYear(), end.getMonth(), end.getDate()),
      title: "Semaine du " + weekStart.getDate() + " " + MONTHS_SHORT[weekStart.getMonth()].toLowerCase()
    };
  }

  function sumTable(range) {
    var table = el("table", "sum");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "", range.title));
    TYPES.forEach(function (t) { hr.appendChild(el("th", "", t.short)); });
    hr.appendChild(el("th", "", "W-E travaillés"));
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = el("tbody");
    state.team.forEach(function (n) {
      var c = countRange(n.id, range.from, range.to);
      var tr = el("tr");
      tr.appendChild(el("td", "", n.name));
      TYPES.forEach(function (t) {
        var v = c[t.id] || 0;
        var cls = v === 0 ? "zero" : (NEEDS_COVER[t.id] ? "alert" : "");
        tr.appendChild(el("td", cls, String(v)));
      });
      tr.appendChild(el("td", c.we ? "" : "zero", String(c.we)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function renderSums() {
    var sp = document.getElementById("sum-period");
    var sy = document.getElementById("sum-year");
    sp.textContent = "";
    sy.textContent = "";
    if (!state.team.length) {
      sp.appendChild(el("div", "empty-hint", "Le récap apparaîtra une fois l'équipe créée."));
      sy.appendChild(el("div", "empty-hint", "Le récap apparaîtra une fois l'équipe créée."));
      return;
    }
    sp.appendChild(sumTable(currentRange()));
    // En vue année, le second panneau ferait doublon.
    document.getElementById("year-panel").hidden = (view === "year");
    if (view !== "year") {
      sy.appendChild(sumTable({ from: fmt(curYear, 0, 1), to: fmt(curYear, 11, 31), title: "Année " + curYear }));
    }
  }

  /* ---------- équipe ---------- */

  function renderTeam() {
    var list = document.getElementById("teamlist");
    list.textContent = "";
    state.team.forEach(function (n) {
      var row = el("div", "teamrow");
      var input = el("input");
      input.type = "text";
      input.value = n.name;
      input.setAttribute("aria-label", "Nom");
      input.addEventListener("change", function () {
        var v = input.value.trim();
        if (!v) { input.value = n.name; return; }
        n.name = v;
        markDirty();
        renderIdentity();
        renderGrid();
        renderSums();
      });
      row.appendChild(input);
      var picker = el("div", "colorpick");
      NURSE_COLORS.forEach(function (c) {
        var b = el("button", n.color === c ? "on" : "");
        b.style.background = c;
        b.setAttribute("aria-label", "Couleur");
        b.addEventListener("click", function () {
          n.color = c;
          markDirty();
          renderTeam();
          renderIdentity();
          renderGrid();
        });
        picker.appendChild(b);
      });
      row.appendChild(picker);
      var del = el("button", "del", "Retirer");
      del.dataset.armed = "";
      del.addEventListener("click", function () {
        if (!del.dataset.armed) {
          del.dataset.armed = "1";
          del.textContent = "Retirer " + n.name + " et son planning ? Confirmer";
          setTimeout(function () {
            if (del.isConnected) { del.dataset.armed = ""; del.textContent = "Retirer"; }
          }, 4000);
          return;
        }
        state.team = state.team.filter(function (x) { return x.id !== n.id; });
        delete state.entries[n.id];
        if (me === n.id) { me = null; lsSet("releve.me", ""); }
        if (yearWho === n.id) yearWho = null;
        markDirty();
        renderAll();
      });
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function addNurse() {
    var input = document.getElementById("add-name");
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    var n = {
      id: uid(),
      name: name,
      color: NURSE_COLORS[state.team.length % NURSE_COLORS.length]
    };
    state.team.push(n);
    if (!me) { me = n.id; lsSet("releve.me", me); }
    input.value = "";
    markDirty();
    renderAll();
    document.getElementById("team-panel").open = true;
    input.focus();
  }
  document.getElementById("add-nurse").addEventListener("click", addNurse);
  document.getElementById("add-name").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addNurse(); }
  });

  /* ---------- saisie des jours ---------- */

  function applyBrush(td) {
    if (!td || !td.dataset.n) return;
    var nid = td.dataset.n, dstr = td.dataset.d;
    var val = brush === "ERASE" ? null : brush;
    var cur = entryOf(nid, dstr);
    if (cur === val) return;
    if (!state.entries[nid]) state.entries[nid] = {};
    if (val === null) delete state.entries[nid][dstr];
    else state.entries[nid][dstr] = val;
    pending[nid + "|" + dstr] = val;
    ssSet(PENDING_KEY, JSON.stringify(pending));
    paintCellContent(td);
    markDirty();
    scheduleSumRefresh();
  }

  var sumTimer = null;
  function scheduleSumRefresh() {
    clearTimeout(sumTimer);
    sumTimer = setTimeout(function () {
      renderSums();
      if (view === "month") renderMonths();
    }, 250);
  }

  var grid = document.getElementById("gridscroll");

  /* Au doigt on peint sur le tap (événement click) et non au contact : sinon
     un simple défilement de la liste marquerait des jours au passage. */
  var touchTap = false;
  grid.addEventListener("pointerdown", function (e) {
    var td = e.target.closest("td.cell");
    if (!td) return;
    if (e.pointerType === "touch") { touchTap = true; return; }
    touchTap = false;
    if (e.button === 2) return;
    painting = true;
    applyBrush(td);
  });
  grid.addEventListener("click", function (e) {
    if (!touchTap) return;
    touchTap = false;
    var td = e.target.closest("td.cell");
    if (td) applyBrush(td);
  });
  grid.addEventListener("pointerover", function (e) {
    if (!painting || !(e.buttons & 1)) return;
    var td = e.target.closest("td.cell");
    if (td) applyBrush(td);
  });
  window.addEventListener("pointerup", function () { painting = false; });
  grid.addEventListener("contextmenu", function (e) {
    var td = e.target.closest("td.cell");
    if (!td) return;
    e.preventDefault();
    var old = brush;
    brush = "ERASE";
    applyBrush(td);
    brush = old;
  });
  grid.addEventListener("keydown", function (e) {
    var td = e.target.closest("td.cell");
    if (!td) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applyBrush(td); }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      var old = brush;
      brush = "ERASE";
      applyBrush(td);
      brush = old;
    }
  });

  /* ---------- navigation ---------- */

  /* L'en-tête du tableau se colle juste sous l'en-tête de page. */
  function measureStick() {
    var h = narrow.matches
      ? Math.round(document.querySelector("header.top").getBoundingClientRect().height)
      : 0;
    document.documentElement.style.setProperty("--stick", h + "px");
  }
  window.addEventListener("resize", measureStick);
  window.addEventListener("orientationchange", measureStick);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureStick);
  if (window.ResizeObserver) {
    new ResizeObserver(measureStick).observe(document.querySelector("header.top"));
  }

  var wasNarrow = narrow.matches;
  function onWidthChange() {
    if (narrow.matches === wasNarrow) return;
    wasNarrow = narrow.matches;
    measureStick();
    renderGrid();
  }
  if (narrow.addEventListener) narrow.addEventListener("change", onWidthChange);
  else if (narrow.addListener) narrow.addListener(onWidthChange);

  document.getElementById("prev").addEventListener("click", function () { shiftPeriod(-1); });
  document.getElementById("next").addEventListener("click", function () { shiftPeriod(1); });
  document.getElementById("today-btn").addEventListener("click", goToday);
  window.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") shiftPeriod(-1);
    else if (e.key === "ArrowRight") shiftPeriod(1);
  });

  /* ---------- enregistrement partagé ---------- */

  /* Deux modes de synchronisation :
     - Supabase (hébergement classique, ex. GitHub Pages) : config.js définit
       window.RELEVE_CONFIG = { supabaseUrl, supabaseKey } ; enregistrement
       automatique, sans rechargement, et rafraîchissement périodique.
     - Artifact claude.ai : la page publie une nouvelle version d'elle-même. */

  var cfg = window.RELEVE_CONFIG || null;
  var supa = null;
  if (cfg && cfg.supabaseUrl && cfg.supabaseKey) {
    supa = {
      endpoint: String(cfg.supabaseUrl).replace(/\/+$/, "") + "/rest/v1/planning",
      docId: cfg.docId || "main",
      rev: 0,
      headers: {
        apikey: cfg.supabaseKey,
        Authorization: "Bearer " + cfg.supabaseKey,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      }
    };
  }

  var AUTOSAVE_MS = 2500;
  var autosaveTimer = null;
  function scheduleAutosave() {
    if (!supa || readOnly) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(save, AUTOSAVE_MS);
  }

  function markDirty() {
    dirty = true;
    updateSaveStatus();
    scheduleAutosave();
  }

  function updateSaveStatus() {
    var st = document.getElementById("save-status");
    var btn = document.getElementById("save-btn");
    if (readOnly) {
      st.textContent = "Lecture seule";
      st.classList.remove("dirty");
      btn.disabled = true;
      return;
    }
    if (saving) {
      st.textContent = "Enregistrement…";
      st.classList.remove("dirty");
      btn.disabled = true;
      return;
    }
    if (dirty) {
      st.textContent = narrow.matches ? "Non enregistré" : "Modifications non enregistrées";
      st.classList.add("dirty");
      btn.disabled = false;
    } else {
      st.textContent = "Enregistré";
      st.classList.remove("dirty");
      btn.disabled = true;
    }
  }

  function supaReq(method, qs, body) {
    return fetch(supa.endpoint + qs, {
      method: method,
      headers: supa.headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function adoptServer(row, initial) {
    supa.rev = row.rev || 0;
    if (row.data && typeof row.data === "object") state = row.data;
    normalizeState();
    var changed = migrateStatuses();
    if (applySeed()) changed = true;
    if (me && !state.team.some(function (n) { return n.id === me; })) { me = null; lsSet("releve.me", ""); }
    if (applyPendingToState() || changed) {
      dirty = true;
      scheduleAutosave();
    } else {
      pending = {};
      ssDel(PENDING_KEY);
      dirty = false;
    }
    if (initial) pickInitialYear();
    renderAll();
  }

  function supaPoll() {
    if (!supa || painting || saving) return;
    supaReq("GET", "?id=eq." + supa.docId + "&select=rev,data")
      .then(function (rows) {
        if (rows.length && (rows[0].rev || 0) > supa.rev) adoptServer(rows[0]);
      })
      .catch(function () { /* hors ligne : nouvelle tentative au prochain cycle */ });
  }

  function supaInit() {
    supaReq("GET", "?id=eq." + supa.docId + "&select=rev,data")
      .then(function (rows) {
        if (rows.length) { adoptServer(rows[0], true); return; }
        // Première ouverture : on crée le document partagé de l'équipe.
        return supaReq("POST", "", { id: supa.docId, rev: 0, data: state })
          .then(function (created) { if (created.length) supa.rev = created[0].rev || 0; })
          .catch(function () { /* une collègue l'a créé en même temps */ });
      })
      .catch(function () {
        var b = document.getElementById("banner");
        b.textContent = "Impossible de joindre la synchronisation pour l'instant : vos modifications restent sur cet appareil et repartiront dès que la connexion revient.";
        b.classList.add("show");
      });
    setInterval(supaPoll, 30000);
    window.addEventListener("focus", supaPoll);
  }

  function supaSave(attempt) {
    supaReq("PATCH", "?id=eq." + supa.docId + "&rev=eq." + supa.rev,
      { rev: supa.rev + 1, data: state, updated_at: new Date().toISOString() })
      .then(function (rows) {
        if (rows.length) {
          supa.rev = rows[0].rev || (supa.rev + 1);
          pending = {};
          ssDel(PENDING_KEY);
          dirty = false;
          saving = false;
          updateSaveStatus();
          return;
        }
        // Quelqu'un a enregistré entre-temps : on reprend sa version,
        // on rejoue nos modifications par-dessus, puis on réessaie.
        return supaReq("GET", "?id=eq." + supa.docId + "&select=rev,data")
          .then(function (rows2) {
            saving = false;
            if (rows2.length) adoptServer(rows2[0]);
            if (dirty && attempt < 3) {
              saving = true;
              updateSaveStatus();
              return supaSave(attempt + 1);
            }
            updateSaveStatus();
          });
      })
      .catch(function () {
        saving = false;
        updateSaveStatus();
        toast("Enregistrement impossible : vérifiez la connexion. Nouvel essai automatique.");
        scheduleAutosave();
      });
  }

  var artifactReady = (!supa && window.claude && window.claude.use)
    ? window.claude.use("artifact")
    : Promise.resolve(null);

  if (!supa) {
    artifactReady.then(function (ns) {
      if (!ns) {
        var b = document.getElementById("banner");
        b.textContent = "Synchronisation non configurée : les modifications restent locales à ce navigateur et ne seront pas partagées avec l'équipe.";
        b.classList.add("show");
      }
    });
  }

  function serializeState() {
    return JSON.stringify(state).replace(/</g, "\\u003c");
  }

  function buildDocument(src) {
    var OPEN = "<!--RELEVE-STATE-->";
    var CLOSE = "<!--/RELEVE-STATE-->";
    var a = src.indexOf(OPEN);
    var b = src.indexOf(CLOSE);
    if (a < 0 || b < 0 || b < a) return null;
    return src.slice(0, a) + OPEN +
      '\n<script type="application/json" id="' + STATE_EL_ID + '">' +
      serializeState() +
      "<\/script>\n" + CLOSE + src.slice(b + CLOSE.length);
  }

  function save() {
    if (saving || readOnly || !dirty) return;
    saving = true;
    updateSaveStatus();
    if (supa) { supaSave(1); return; }
    artifactReady.then(function (ns) {
      if (!ns) {
        saving = false;
        updateSaveStatus();
        toast("Enregistrement partagé indisponible ici.");
        return;
      }
      fetch(location.href, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("source");
          return r.text();
        })
        .then(function (src) {
          var doc = buildDocument(src);
          if (!doc) throw new Error("source");
          return ns.publish(doc);
        })
        .then(function () {
          ssDel(PENDING_KEY);
          dirty = false;
          saving = false;
          updateSaveStatus();
        })
        .catch(function (err) {
          saving = false;
          var code = err && err.code;
          if (code === "conflict") {
            toast("Quelqu'un vient d'enregistrer : rechargement, vos modifications seront réappliquées.");
            return;
          }
          if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared") {
            readOnly = true;
            updateSaveStatus();
            var b = document.getElementById("banner");
            b.textContent = "Vous consultez ce planning en lecture seule. Demandez un accès « modification » pour enregistrer vos jours.";
            b.classList.add("show");
            return;
          }
          if (code === "rate_limited") {
            updateSaveStatus();
            toast("Enregistrements trop rapprochés : réessayez dans quelques secondes.");
            return;
          }
          updateSaveStatus();
          toast("Échec de l'enregistrement : vérifiez la connexion puis réessayez.");
        });
    });
  }

  document.getElementById("save-btn").addEventListener("click", save);
  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  });
  window.addEventListener("beforeunload", function (e) {
    if (dirty && !saving && !readOnly) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ---------- application installable ---------- */

  if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* hors ligne indisponible : l'application reste utilisable en ligne */
      });
    });
  }

  /* Sur iPhone, l'installation passe par le menu Partager de Safari. */
  (function installHint() {
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone || lsGet("releve.hideInstall")) return;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (!ios) return;
    var hint = el("p", "install-hint");
    hint.appendChild(document.createTextNode("Pour l'ajouter à votre écran d'accueil : Partager puis « Sur l'écran d'accueil »."));
    var close = el("button", "iconbtn", "✕");
    close.style.cssText = "width:24px;height:24px;margin-left:8px;vertical-align:middle";
    close.setAttribute("aria-label", "Masquer ce conseil");
    close.addEventListener("click", function () {
      lsSet("releve.hideInstall", "1");
      hint.remove();
    });
    hint.appendChild(close);
    document.querySelector(".wrap").appendChild(hint);
  })();

  /* ---------- démarrage ---------- */

  function renderAll() {
    renderViewSwitch();
    renderPeriod();
    renderMonths();
    renderIdentity();
    renderPalette();
    renderGrid();
    renderSums();
    renderTeam();
    updateSaveStatus();
  }

  var changedAtStart = migrateStatuses();
  if (applySeed()) changedAtStart = true;
  if (changedAtStart) dirty = true;
  pickInitialYear();
  renderAll();
  measureStick();
  if (supa) supaInit();
  if (dirty) {
    if (supa) scheduleAutosave();
    else toast("Planning mis à jour : cliquez sur Enregistrer pour le partager.");
  }
})();
</script>
</body>
</html>
