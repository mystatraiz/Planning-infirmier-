<script>
(function () {
  "use strict";

  /* ---------- statuts ---------- */

  var TYPES = [
    { id: "T",   label: "Travail",          glyph: "T",  short: "Travail" },
    { id: "R",   label: "Repos",            glyph: "R",  short: "Repos" },
    { id: "RAT", label: "Rempla à trouver", glyph: "?",  short: "À trouver" },
    { id: "RB",  label: "Rempla booké",     glyph: "RB", short: "Booké" }
  ];
  var WORKED = { T: 1 };            // seul « Travail » compte comme jour travaillé
  var NEEDS_COVER = { RAT: 1 };     // jours à couvrir : mis en avant dans les récaps

  /* ---------- état ---------- */

  var STATE_EL_ID = "app-state";
  var state = { v: 2, team: [], entries: {}, seeds: [] };
  try {
    state = JSON.parse(document.getElementById(STATE_EL_ID).textContent);
  } catch (e) { /* état illisible : on repart d'une base vide */ }

  function normalizeState() {
    state.team = state.team || [];
    state.entries = state.entries || {};
    state.seeds = state.seeds || [];
    state.subs = state.subs || [];    // carnet des remplaçants
    state.cover = state.cover || {};  // { "2027-03-05": { st: "RAT"|"RB", sub: id|null } }
    state.types = TYPES;              // la liste des statuts est fixée par l'application
    state.v = 2;
  }
  normalizeState();

  var NURSE_COLORS = ["#E5322B", "#1FC7C7", "#2FB344", "#0E6E66", "#B85C38",
                      "#5B6FB5", "#8A5BA0", "#3E7CB1", "#C2803A", "#A64D6D"];

  /* Texte lisible sur une couleur d'infirmière (clair ou foncé selon sa luminance). */
  function inkOn(hex) {
    var c = String(hex || "").replace("#", "");
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    if (c.length !== 6) return "#FFFFFF";
    function lin(v) {
      v = parseInt(v, 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    var L = 0.2126 * lin(c.slice(0, 2)) + 0.7152 * lin(c.slice(2, 4)) + 0.0722 * lin(c.slice(4, 6));
    return L > 0.42 ? "#10241F" : "#FFFFFF";
  }
  var MONTHS = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin",
    "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
  var MONTHS_SHORT = ["Janv.", "Févr.", "Mars", "Avr.", "Mai", "Juin",
    "Juil.", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
  var DOW = ["D", "L", "M", "M", "J", "V", "S"];
  var DOW_SHORT = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
  var DOW_LONG = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];

  var now = new Date();
  var curYear = now.getFullYear();
  var curMonth = now.getMonth();
  var weekStart = mondayOf(now);
  var view = "month";
  var brush = "T";
  var dirty = false;
  var saving = false;
  var readOnly = false;
  var painting = false;
  var me = null;
  var ALL = "__all__";          // vue globale : toute l'équipe
  var focusWho = ALL;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) { } }

  me = lsGet("releve.me");
  if (me && !state.team.some(function (n) { return n.id === me; })) me = null;
  var savedFocus = lsGet("releve.focus");
  if (savedFocus) focusWho = savedFocus;
  var savedView = lsGet("releve.view");
  if (["year", "month", "week"].indexOf(savedView) >= 0) view = savedView;

  /* Modifications en attente : rejouées après un rechargement ou par-dessus une
     version plus récente du serveur, pour ne jamais perdre ce qui vient d'être saisi. */
  var PENDING_KEY = "releve.pending";
  var pending = {};

  function applyPendingToState() {
    var changed = false;
    Object.keys(pending).forEach(function (key) {
      var parts = key.split("|");
      var nid = parts[0], date = parts[1], val = pending[key];
      if (!state.team.some(function (n) { return n.id === nid; })) return;
      var cur = (state.entries[nid] || {})[date] || null;
      if (cur === val) return;
      if (!state.entries[nid]) state.entries[nid] = {};
      if (val === null) delete state.entries[nid][date];
      else state.entries[nid][date] = val;
      changed = true;
    });
    return changed;
  }

  (function restorePending() {
    var raw = ssGet(PENDING_KEY);
    if (!raw) return;
    try { pending = JSON.parse(raw) || {}; } catch (e) { pending = {}; ssDel(PENDING_KEY); return; }
    if (applyPendingToState()) { dirty = true; }
    else { pending = {}; ssDel(PENDING_KEY); }
  })();

  /* ---------- jours fériés (France métropolitaine) ---------- */

  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31);
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  var holidayCache = {};
  function holidays(y) {
    if (holidayCache[y]) return holidayCache[y];
    var set = {};
    [[0, 1], [4, 1], [4, 8], [6, 14], [7, 15], [10, 1], [10, 11], [11, 25]]
      .forEach(function (md) { set[fmt(y, md[0], md[1])] = true; });
    var p = easter(y);
    [1, 39, 50].forEach(function (off) {
      var d = new Date(p.getFullYear(), p.getMonth(), p.getDate() + off);
      set[fmt(d.getFullYear(), d.getMonth(), d.getDate())] = true;
    });
    holidayCache[y] = set;
    return set;
  }

  /* ---------- utilitaires ---------- */

  function fmt(y, m, d) {
    return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function mondayOf(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }
  function addDays(date, n) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
  }
  function typeById(id) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return TYPES[i];
    return null;
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function uid() { return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayStr() { return fmt(now.getFullYear(), now.getMonth(), now.getDate()); }
  function entryOf(nid, dstr) { return (state.entries[nid] || {})[dstr] || null; }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }

  /* ---------- passage aux quatre statuts ---------- */

  /* Les anciens codes (Matin, Soir, Nuit, Journée, Formation, Congés) sont
     convertis une seule fois vers Travail / Repos. */
  var STATUS_MIGRATION = {
    id: "statuts-v2",
    map: { M: "T", S: "T", N: "T", J: "T", F: "T", CA: "R", R: "R", T: "T", RAT: "RAT", RB: "RB" }
  };

  function migrateStatuses() {
    if (state.seeds.indexOf(STATUS_MIGRATION.id) >= 0) return false;
    Object.keys(state.entries).forEach(function (nid) {
      var days = state.entries[nid];
      Object.keys(days).forEach(function (d) {
        var to = STATUS_MIGRATION.map[days[d]];
        if (to) days[d] = to;
        else delete days[d];
      });
    });
    state.seeds.push(STATUS_MIGRATION.id);
    return true;
  }

  /* ---------- roulement pré-rempli ---------- */

  /* Roulement de deux semaines entre deux personnes, qui couvre tous les jours
     de l'année : semaine A = lundi, mardi, vendredi, samedi, dimanche ;
     semaine B = mercredi, jeudi ; les deux s'échangent chaque semaine.
     Axelle commence en semaine A, ce qui la place au travail le 1er janvier
     2027 (un vendredi). Appliqué une seule fois. */
  var SEED = {
    id: "roulement-2027",
    year: 2027,
    anchorDay: Math.floor(Date.UTC(2026, 11, 28) / 86400000), // lundi de la semaine du 1er janvier 2027
    weekA: [0, 1, 4, 5, 6], // 0 = lundi
    nurses: [
      { name: "Axelle", color: "#0E6E66", phase: 0 },
      { name: "Collègue", color: "#B85C38", phase: 1 }
    ],
    work: "T",
    rest: "R"
  };

  function applySeed() {
    if (state.seeds.indexOf(SEED.id) >= 0) return false;
    var ids = SEED.nurses.map(function (s) {
      var found = null;
      for (var i = 0; i < state.team.length; i++) {
        if (state.team[i].name.trim().toLowerCase() === s.name.toLowerCase()) { found = state.team[i]; break; }
      }
      if (!found) {
        found = { id: uid(), name: s.name, color: s.color };
        state.team.push(found);
      }
      if (!state.entries[found.id]) state.entries[found.id] = {};
      return found.id;
    });
    for (var m = 0; m < 12; m++) {
      var nd = daysInMonth(SEED.year, m);
      for (var d = 1; d <= nd; d++) {
        var dstr = fmt(SEED.year, m, d);
        var week = Math.floor((Math.floor(Date.UTC(SEED.year, m, d) / 86400000) - SEED.anchorDay) / 7);
        var inA = SEED.weekA.indexOf((new Date(SEED.year, m, d).getDay() + 6) % 7) >= 0;
        for (var i = 0; i < SEED.nurses.length; i++) {
          var weekIsA = ((week + SEED.nurses[i].phase) % 2) === 0;
          state.entries[ids[i]][dstr] = (weekIsA ? inA : !inA) ? SEED.work : SEED.rest;
        }
      }
    }
    state.seeds.push(SEED.id);
    return true;
  }

  /* Plannings repris du planning existant de l'équipe, mois par mois.
     Axelle en rouge, Chloé en cyan, la remplaçante en vert. Chaque plan n'est
     appliqué qu'une seule fois (marqueur dans state.seeds). */
  var PLAN_COLORS = { "Axelle": "#E5322B", "Chloé": "#1FC7C7", "Remplaçante": "#2FB344" };

  var MONTH_PLANS = [
    {
      id: "planning-sept-2026", year: 2026, month: 8,
      days: {
        "Axelle": [1, 3, 7, 8, 11, 13, 16, 17, 21, 22, 25, 26, 27, 30],
        "Chloé": [4, 5, 6, 9, 10, 14, 15, 18, 19, 20, 24, 28, 29],
        "Remplaçante": [2, 12, 23]
      }
    },
    {
      id: "planning-oct-2026", year: 2026, month: 9,
      days: {
        "Axelle": [1, 5, 6, 9, 10, 11, 14, 15, 19, 20, 21, 22, 23],
        "Chloé": [2, 3, 4, 7, 8, 12, 13, 16, 17, 18, 27, 30, 31],
        "Remplaçante": [24, 25, 26]
        // les 28 et 29 octobre ne sont assurés par personne
      }
    },
    {
      // Le 1er novembre porte deux couleurs sur le planning d'origine :
      // c'est Chloé qui est retenue.
      id: "planning-nov-2026", year: 2026, month: 10,
      days: {
        "Axelle": [2, 3, 6, 8, 11, 12, 16, 17, 20, 21, 22, 25, 26, 30],
        "Chloé": [1, 4, 5, 9, 10, 13, 14, 15, 18, 19, 23, 24, 27, 28, 29],
        "Remplaçante": [7]
      }
    }
  ];

  /* Les titulaires ont un repos les jours non travaillés ; la remplaçante
     n'apparaît que les jours où elle intervient. */
  var REGULARS = { "Axelle": 1, "Chloé": 1 };

  /* Comparaison de noms insensible à la casse ET aux accents :
     « Chloe » et « Chloé » désignent la même personne. */
  function normName(v) {
    var t = String(v || "").trim().toLowerCase();
    if (t.normalize) t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return t.replace(/\s+/g, " ");
  }

  function findByName(name) {
    var want = normName(name);
    for (var i = 0; i < state.team.length; i++) {
      if (normName(state.team[i].name) === want) return state.team[i];
    }
    return null;
  }

  /* Fusionne les fiches qui désignent la même personne (orthographe ou accent
     différents). Sans effet quand il n'y a pas de doublon. */
  function mergeDuplicateNames() {
    var changed = false;

    var seen = {}, keep = [];
    state.team.forEach(function (n) {
      var k = normName(n.name);
      if (!seen[k]) { seen[k] = n; keep.push(n); return; }
      var target = seen[k];
      var src = state.entries[n.id] || {};
      if (!state.entries[target.id]) state.entries[target.id] = {};
      Object.keys(src).forEach(function (d) {
        var cur = state.entries[target.id][d];
        // En cas de désaccord, un jour travaillé l'emporte sur un repos.
        if (!cur || (src[d] === "T" && cur !== "T")) state.entries[target.id][d] = src[d];
      });
      delete state.entries[n.id];
      if (me === n.id) { me = target.id; lsSet("releve.me", me); }
      if (focusWho === n.id) { focusWho = target.id; lsSet("releve.focus", focusWho); }
      changed = true;
    });
    if (changed) {
      state.team = keep;
      // Rendre leur couleur aux personnes des plannings repris.
      Object.keys(PLAN_COLORS).forEach(function (name) {
        var m = findByName(name);
        if (m) m.color = PLAN_COLORS[name];
      });
    }

    var seenS = {}, keepS = [];
    state.subs.forEach(function (sb) {
      var k = normName(sb.name);
      if (!seenS[k]) { seenS[k] = sb; keepS.push(sb); return; }
      var target = seenS[k];
      if (!target.phone && sb.phone) target.phone = sb.phone;
      Object.keys(state.cover).forEach(function (d) {
        if (state.cover[d].sub === sb.id) state.cover[d].sub = target.id;
      });
      changed = true;
    });
    if (keepS.length !== state.subs.length) state.subs = keepS;

    return changed;
  }

  function applyMonthPlans() {
    var changed = false;
    MONTH_PLANS.forEach(function (plan) {
      if (state.seeds.indexOf(plan.id) >= 0) return;
      // « Collègue » du roulement initial est en fait Chloé.
      if (!findByName("Chloé")) {
        var col = findByName("Collègue");
        if (col) col.name = "Chloé";
      }
      var nd = daysInMonth(plan.year, plan.month);
      Object.keys(plan.days).forEach(function (name) {
        var found = findByName(name);
        if (!found) {
          found = { id: uid(), name: name, color: PLAN_COLORS[name] };
          state.team.push(found);
        }
        if (PLAN_COLORS[name]) found.color = PLAN_COLORS[name];
        if (!state.entries[found.id]) state.entries[found.id] = {};
        for (var d = 1; d <= nd; d++) {
          var dstr = fmt(plan.year, plan.month, d);
          if (plan.days[name].indexOf(d) >= 0) state.entries[found.id][dstr] = "T";
          else if (REGULARS[name]) state.entries[found.id][dstr] = "R";
        }
      });
      state.seeds.push(plan.id);
      changed = true;
    });
    return changed;
  }

  function yearHasEntries(y) {
    var ids = Object.keys(state.entries);
    for (var i = 0; i < ids.length; i++) {
      var ds = Object.keys(state.entries[ids[i]]);
      for (var j = 0; j < ds.length; j++) if (ds[j].indexOf(y + "-") === 0) return true;
    }
    return false;
  }

  /* Ouvrir directement sur une période qui contient un planning. */
  function pickInitialYear() {
    if (!yearHasEntries(curYear)) {
      if (!yearHasEntries(SEED.year)) return;
      curYear = SEED.year;
      curMonth = 0;
    }
    if (monthHasEntries(curYear, curMonth)) return;
    // Le mois courant est vide : on avance au prochain mois rempli de l'année.
    for (var i = 1; i <= 12; i++) {
      var m = (curMonth + i) % 12;
      if (monthHasEntries(curYear, m)) { curMonth = m; break; }
    }
    weekStart = mondayOf(new Date(curYear, curMonth, 1));
  }

  /* ---------- rendu : entêtes et contrôles ---------- */

  var narrow = window.matchMedia("(max-width: 760px)");

  var VIEWS = [
    { id: "year", label: "Année" },
    { id: "month", label: "Mois" },
    { id: "week", label: "Semaine" }
  ];
  var MONTH_VIEWS = { month: 1 };   // vues cadrées sur un mois

  function renderViewSwitch() {
    var box = document.getElementById("viewswitch");
    box.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button", view === v.id ? "on" : "", v.label);
      b.setAttribute("aria-pressed", view === v.id ? "true" : "false");
      b.addEventListener("click", function () { setView(v.id); });
      box.appendChild(b);
    });
  }

  function setView(next) {
    if (view === next) return;
    // Garder la période cohérente d'une vue à l'autre.
    if (next === "week") {
      var inMonth = weekStart.getFullYear() === curYear && weekStart.getMonth() === curMonth;
      if (!inMonth) {
        var day = (curYear === now.getFullYear() && curMonth === now.getMonth()) ? now.getDate() : 1;
        weekStart = mondayOf(new Date(curYear, curMonth, day));
      }
    } else if (view === "week") {
      curYear = weekStart.getFullYear();
      curMonth = weekStart.getMonth();
    }
    view = next;
    lsSet("releve.view", view);
    renderAll();
  }

  function periodLabel() {
    if (view === "year") return String(curYear);
    if (MONTH_VIEWS[view]) return MONTHS[curMonth] + " " + curYear;
    var end = addDays(weekStart, 6);
    var a = weekStart.getDate(), b = end.getDate();
    if (weekStart.getMonth() === end.getMonth()) {
      return a + " – " + b + " " + MONTHS_SHORT[end.getMonth()].toLowerCase() + " " + end.getFullYear();
    }
    return a + " " + MONTHS_SHORT[weekStart.getMonth()].toLowerCase() + " – " +
      b + " " + MONTHS_SHORT[end.getMonth()].toLowerCase() + " " + end.getFullYear();
  }

  function renderPeriod() {
    document.getElementById("period-label").textContent = periodLabel();
    document.getElementById("months").hidden = !MONTH_VIEWS[view];
  }

  function shiftPeriod(dir) {
    if (view === "year") curYear += dir;
    else if (MONTH_VIEWS[view]) {
      curMonth += dir;
      if (curMonth > 11) { curMonth = 0; curYear++; }
      if (curMonth < 0) { curMonth = 11; curYear--; }
    } else {
      weekStart = addDays(weekStart, 7 * dir);
      curYear = weekStart.getFullYear();
      curMonth = weekStart.getMonth();
    }
    renderAll();
  }

  function goToday() {
    curYear = now.getFullYear();
    curMonth = now.getMonth();
    weekStart = mondayOf(now);
    renderAll();
  }

  function monthHasEntries(y, m) {
    var prefix = y + "-" + String(m + 1).padStart(2, "0");
    var ids = Object.keys(state.entries);
    for (var i = 0; i < ids.length; i++) {
      var dates = Object.keys(state.entries[ids[i]]);
      for (var j = 0; j < dates.length; j++) if (dates[j].indexOf(prefix) === 0) return true;
    }
    return false;
  }

  function renderMonths() {
    var nav = document.getElementById("months");
    nav.textContent = "";
    for (var m = 0; m < 12; m++) {
      (function (m) {
        var b = el("button", m === curMonth ? "on" : "", MONTHS_SHORT[m]);
        if (monthHasEntries(curYear, m)) b.appendChild(el("span", "dot"));
        b.addEventListener("click", function () { curMonth = m; renderAll(); });
        nav.appendChild(b);
      })(m);
    }
    var on = nav.querySelector("button.on");
    if (on && nav.scrollWidth > nav.clientWidth) {
      nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.offsetWidth / 2, behavior: "auto" });
    }
  }

  /* Ligne « Afficher » : la vue globale et chaque infirmière. */
  function renderIdentity() {
    var box = document.getElementById("identity-chips");
    box.textContent = "";
    if (!state.team.length) {
      box.appendChild(el("span", "chip ghost", "ajoutez l'équipe ci-dessous"));
      return;
    }
    var all = el("button", "chip" + (focusWho === ALL ? " on" : ""), "Tous");
    all.title = "Vue globale de l'équipe";
    all.addEventListener("click", function () { setFocus(ALL); });
    box.appendChild(all);
    state.team.forEach(function (n) {
      var c = el("button", "chip" + (focusWho === n.id ? " on" : ""));
      var sw = el("span", "swatch");
      sw.style.background = n.color;
      c.appendChild(sw);
      c.appendChild(document.createTextNode(n.name));
      if (me === n.id) c.title = "C'est vous";
      c.addEventListener("click", function () { setFocus(n.id); });
      box.appendChild(c);
    });
  }

  function setFocus(who) {
    focusWho = who;
    lsSet("releve.focus", who);
    renderIdentity();
    renderPalette();
    renderGrid();
  }

  function isGlobal() { return focusWho === ALL; }

  function resolveFocus() {
    if (focusWho === ALL) return;
    if (!state.team.some(function (n) { return n.id === focusWho; })) {
      focusWho = state.team.length ? (me || state.team[0].id) : ALL;
    }
  }

  function renderPalette() {
    var box = document.getElementById("palette");
    document.getElementById("palette-group").hidden = isGlobal();
    box.textContent = "";
    if (isGlobal()) return;
    TYPES.forEach(function (t) {
      var c = el("button", "chip tool" + (brush === t.id ? " on" : ""));
      c.appendChild(el("span", "code s-" + t.id, t.glyph));
      c.appendChild(document.createTextNode(t.label));
      c.addEventListener("click", function () { brush = t.id; renderPalette(); });
      box.appendChild(c);
    });
    var er = el("button", "chip tool" + (brush === "ERASE" ? " on" : ""), "✕ Effacer");
    er.addEventListener("click", function () { brush = "ERASE"; renderPalette(); });
    box.appendChild(er);
  }

  /* ---------- rendu : grille ---------- */

  function makeCell(nid, dstr, extraCls) {
    var td = el("td", "cell" + (extraCls ? " " + extraCls : ""));
    td.dataset.n = nid;
    td.dataset.d = dstr;
    td.tabIndex = 0;
    paintCellContent(td);
    return td;
  }

  function paintCellContent(td) {
    var code = entryOf(td.dataset.n, td.dataset.d);
    var t = code ? typeById(code) : null;
    if (td.dataset.cal === "1") {
      var bar = td.querySelector("i");
      if (!bar) { bar = el("i"); td.appendChild(bar); }
      bar.className = t ? "s-" + code : "";
      // label "1" = statut écrit en toutes lettres, "0" = abrégé, absent = trait seul
      var lab = td.dataset.label;
      bar.textContent = t ? (lab === "1" ? t.label : (lab === "0" ? t.glyph : "")) : "";
      td.title = t ? t.label : "";
      return;
    }
    td.textContent = "";
    if (t) {
      var s = el("span", "s-" + code, td.dataset.full === "1" ? t.label : t.glyph);
      s.title = t.label;
      td.appendChild(s);
    }
  }

  function renderGrid() {
    var top = document.getElementById("gridtop");
    var scroll = document.getElementById("gridscroll");
    var hint = document.getElementById("grid-hint");
    top.textContent = "";
    scroll.textContent = "";
    if (!state.team.length) {
      scroll.appendChild(el("div", "empty-hint",
        "Aucune infirmière pour l'instant. Ouvrez « Gérer l'équipe » en bas de page pour ajouter les membres, puis chacune pourra remplir ses jours."));
      hint.textContent = "";
      return;
    }
    resolveFocus();
    if (view === "year") renderYear(top, scroll, hint);
    else if (view === "week") renderWeek(scroll, hint);
    else if (isGlobal()) {
      if (narrow.matches) renderGlobalList(scroll, hint);
      else renderGlobalCalendar(scroll, hint);
    } else renderMonthCalendar(top, scroll, hint);
  }

  /* Qui travaille ce jour-là, et la couverture éventuelle. */
  function workersOn(dstr) {
    return state.team.filter(function (n) { return entryOf(n.id, dstr) === "T"; });
  }
  function coverOn(dstr) {
    var c = state.cover[dstr];
    return (c && (c.st === "RAT" || c.st === "RB")) ? c : null;
  }
  function subById(id) {
    for (var i = 0; i < state.subs.length; i++) if (state.subs[i].id === id) return state.subs[i];
    return null;
  }
  function coverLabel(c) {
    if (c.st === "RAT") return "Rempla à trouver";
    var sb = c.sub ? subById(c.sub) : null;
    return sb ? "Rempla : " + sb.name : "Rempla booké";
  }

  /* Semaines d'un mois, du lundi précédant le 1er au dimanche suivant le dernier. */
  function monthWeeks(y, m) {
    var start = mondayOf(new Date(y, m, 1));
    var last = new Date(y, m, daysInMonth(y, m));
    var weeks = Math.round((dayIndex(mondayOf(last)) - dayIndex(start)) / 7) + 1;
    return { start: start, weeks: weeks };
  }

  function weekdayHead(table) {
    var thead = el("thead");
    var hr = el("tr");
    ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."].forEach(function (d, i) {
      hr.appendChild(el("th", i >= 5 ? "wend" : null, d));
    });
    thead.appendChild(hr);
    table.appendChild(thead);
  }

  /* Classes communes d'une journée de calendrier. */
  function dayClasses(date, m, hols, today) {
    var y = date.getFullYear(), mo = date.getMonth(), d = date.getDate();
    var dstr = fmt(y, mo, d);
    var inMonth = (mo === m && y === curYear);
    var cls = [];
    if (!inMonth) cls.push("out");
    else {
      if (hols(y)[dstr]) cls.push("hol");
      if (dstr === today) cls.push("today");
    }
    return { dstr: dstr, day: d, inMonth: inMonth, cls: cls };
  }

  /* Vue globale : chaque journée n'affiche que les personnes qui travaillent,
     à leur couleur, plus la couverture (rempla à trouver / booké). */
  /* Postes signalés par une infirmière elle-même comme à remplacer. */
  function flaggedOn(dstr) {
    return state.team.filter(function (n) {
      var e = entryOf(n.id, dstr);
      return e === "RAT" || e === "RB";
    });
  }

  function globalDayContent(td, dstr) {
    var who = workersOn(dstr);
    who.forEach(function (n) {
      var tag = el("div", "wtag");
      tag.style.background = n.color;
      tag.style.color = inkOn(n.color);
      tag.textContent = n.name;
      tag.title = n.name + " — Travail";
      td.appendChild(tag);
    });
    var flagged = flaggedOn(dstr);
    flagged.forEach(function (n) {
      var code = entryOf(n.id, dstr);
      var t = typeById(code);
      var tag = el("div", "wtag cover s-" + code, n.name + " · " + t.label.toLowerCase());
      tag.title = n.name + " — " + t.label;
      td.appendChild(tag);
    });
    var c = coverOn(dstr);
    if (c) {
      var ct = el("div", "wtag cover s-" + c.st, coverLabel(c));
      ct.title = coverLabel(c);
      td.appendChild(ct);
    }
    if (!who.length && !flagged.length && !c) td.appendChild(el("div", "nobody", "personne"));
  }

  function renderGlobalCalendar(scroll, hint) {
    var today = todayStr();
    var w = monthWeeks(curYear, curMonth);
    var table = el("table", "gcal");
    weekdayHead(table);
    var tbody = el("tbody");
    for (var i = 0; i < w.weeks; i++) {
      var tr = el("tr");
      for (var k = 0; k < 7; k++) {
        var date = addDays(w.start, i * 7 + k);
        var info = dayClasses(date, curMonth, holidays, today);
        var td = el("td", info.cls.join(" "));
        td.appendChild(el("b", null, String(info.day)));
        if (info.inMonth) globalDayContent(td, info.dstr);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    hint.textContent = "Vue globale : seules les personnes qui travaillent sont affichées. Choisissez une infirmière ci-dessus pour modifier son planning.";
  }

  /* Sur téléphone, la même chose en liste : un jour par ligne. */
  function renderGlobalList(scroll, hint) {
    var nd = daysInMonth(curYear, curMonth);
    var hols = holidays(curYear);
    var today = todayStr();
    var list = el("div", "glist");
    for (var d = 1; d <= nd; d++) {
      var dstr = fmt(curYear, curMonth, d);
      var date = new Date(curYear, curMonth, d);
      var cls = ["grow"];
      if (date.getDay() === 0 || date.getDay() === 6) cls.push("we");
      if (hols[dstr]) cls.push("hol");
      if (dstr === today) cls.push("today");
      var row = el("div", cls.join(" "));
      var day = el("div", "gdate");
      day.appendChild(el("span", "dw", DOW_SHORT[date.getDay()]));
      day.appendChild(document.createTextNode(String(d)));
      row.appendChild(day);
      var tags = el("div", "gtags");
      globalDayContent(tags, dstr);
      row.appendChild(tags);
      list.appendChild(row);
    }
    scroll.appendChild(list);
    hint.textContent = "Vue globale : seules les personnes qui travaillent sont affichées. Choisissez une infirmière ci-dessus pour modifier son planning.";
  }

  /* Vue mois : une seule personne, calendrier mensuel avec statuts en clair. */
  function renderMonthCalendar(top, scroll, hint) {
    var today = todayStr();
    var hols = holidays;
    var w = monthWeeks(curYear, curMonth);
    var table = el("table", "mcal");
    weekdayHead(table);
    var tbody = el("tbody");
    for (var i = 0; i < w.weeks; i++) {
      var tr = el("tr");
      for (var k = 0; k < 7; k++) {
        var date = addDays(w.start, i * 7 + k);
        var info = dayClasses(date, curMonth, hols, today);
        var cls = info.cls.slice();
        if (info.inMonth) cls.push("cell");
        var td = el("td", cls.join(" "));
        td.appendChild(el("b", null, String(info.day)));
        td.appendChild(el("i"));
        td.dataset.cal = "1";
        td.dataset.label = narrow.matches ? "0" : "1";
        if (info.inMonth) {
          td.dataset.n = focusWho;
          td.dataset.d = info.dstr;
          td.tabIndex = 0;
        }
        paintCellContent(td);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    hint.textContent = "Choisissez un statut puis touchez les jours. Changez de personne avec les onglets ci-dessus.";
  }

  /* Vue semaine : sept jours détaillés. En vue globale, seules les personnes
     qui travaillent apparaissent ; sinon le statut de la personne choisie. */
  function renderWeek(scroll, hint) {
    var hols = holidays(weekStart.getFullYear());
    var holsEnd = holidays(addDays(weekStart, 6).getFullYear());
    var today = todayStr();
    var person = isGlobal() ? null : state.team.filter(function (n) { return n.id === focusWho; })[0];

    var table = el("table", "wgrid");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "wcorner", "Semaine"));
    if (person) {
      var th = el("th", me === person.id ? "mine" : "");
      var sw = el("span", "swatch");
      sw.style.background = person.color;
      th.appendChild(sw);
      th.appendChild(document.createTextNode(person.name));
      hr.appendChild(th);
    } else {
      hr.appendChild(el("th", null, "Qui travaille"));
    }
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    for (var i = 0; i < 7; i++) {
      var date = addDays(weekStart, i);
      var dstr = fmt(date.getFullYear(), date.getMonth(), date.getDate());
      var cls = [];
      if (date.getDay() === 0 || date.getDay() === 6) cls.push("we");
      if (hols[dstr] || holsEnd[dstr]) cls.push("hol");
      if (dstr === today) cls.push("today");
      var tr = el("tr", cls.join(" "));
      var dayTh = el("th", "wday");
      dayTh.appendChild(el("span", "dw", DOW_LONG[date.getDay()] + " "));
      dayTh.appendChild(document.createTextNode(String(date.getDate())));
      dayTh.appendChild(el("span", "dm", MONTHS_SHORT[date.getMonth()].toLowerCase()));
      tr.appendChild(dayTh);
      if (person) {
        var td = makeCell(person.id, dstr);
        td.dataset.full = "1";
        paintCellContent(td);
        tr.appendChild(td);
      } else {
        var gtd = el("td", "wtags");
        globalDayContent(gtd, dstr);
        tr.appendChild(gtd);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    hint.textContent = person
      ? "Choisissez un statut puis touchez une case pour l'appliquer sur cette semaine."
      : "Vue globale de la semaine. Choisissez une infirmière ci-dessus pour modifier son planning.";
  }

  /* Vue année : douze calendriers mensuels, un trait de couleur sous chaque
     jour. Une infirmière à la fois, choisie par les onglets. */
  function renderYear(top, scroll, hint) {
    var today = todayStr();
    var cal = el("div", "ycal");
    for (var m = 0; m < 12; m++) cal.appendChild(monthCard(m, today));
    scroll.appendChild(cal);

    var legend = el("div", "ylegend");
    TYPES.forEach(function (t) {
      var s = el("span");
      s.appendChild(el("i", "s-" + t.id));
      s.appendChild(document.createTextNode(t.label));
      legend.appendChild(s);
    });
    scroll.appendChild(legend);
    hint.textContent = "Touchez un jour pour le modifier, ou le nom d'un mois pour l'ouvrir en détail.";
  }

  /* Trait de l'année en vue globale : une part par personne au travail. */
  function globalBar(dstr) {
    var i = el("i", "seg");
    workersOn(dstr).forEach(function (n) {
      var sg = el("span");
      sg.style.background = n.color;
      i.appendChild(sg);
    });
    flaggedOn(dstr).forEach(function (n) {
      i.appendChild(el("span", "s-" + entryOf(n.id, dstr)));
    });
    var c = coverOn(dstr);
    if (c) i.appendChild(el("span", "s-" + c.st));
    return i;
  }

  function dayIndex(date) {
    return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
  }

  function monthCard(m, today) {
    var card = el("div", "ymcard");
    var title = el("button", "ymtitle", MONTHS[m] + " " + curYear);
    title.title = "Ouvrir " + MONTHS[m] + " en détail";
    title.addEventListener("click", function () { curMonth = m; setView("month"); });
    card.appendChild(title);

    var table = el("table", "ycalt");
    weekdayHead(table);
    var w = monthWeeks(curYear, m);
    var tbody = el("tbody");
    for (var i = 0; i < w.weeks; i++) {
      var tr = el("tr");
      for (var k = 0; k < 7; k++) {
        var date = addDays(w.start, i * 7 + k);
        var info = dayClasses(date, m, holidays, today);
        var cls = info.cls.slice();
        if (info.inMonth && !isGlobal()) cls.push("cell");
        var td = el("td", cls.join(" "));
        td.appendChild(el("b", null, String(info.day)));
        if (isGlobal()) {
          td.appendChild(globalBar(info.dstr));
        } else {
          td.appendChild(el("i"));
          td.dataset.cal = "1";
          // Les jours des mois voisins gardent leur trait, en retrait, sans être modifiables.
          td.dataset.n = focusWho;
          td.dataset.d = info.dstr;
          if (info.inMonth) td.tabIndex = 0;
          paintCellContent(td);
          if (!info.inMonth) delete td.dataset.n;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    card.appendChild(table);
    return card;
  }

  /* ---------- récapitulatifs ---------- */

  function countRange(nid, from, to) {
    var counts = { we: 0 };
    TYPES.forEach(function (t) { counts[t.id] = 0; });
    var entries = state.entries[nid] || {};
    Object.keys(entries).forEach(function (dstr) {
      if (dstr < from || dstr > to) return;
      var code = entries[dstr];
      if (counts[code] == null) return;
      counts[code]++;
      if (WORKED[code]) {
        var parts = dstr.split("-");
        var day = new Date(+parts[0], +parts[1] - 1, +parts[2]).getDay();
        if (day === 0 || day === 6) counts.we++;
      }
    });
    return counts;
  }

  function currentRange() {
    if (view === "year") {
      return { from: fmt(curYear, 0, 1), to: fmt(curYear, 11, 31), title: "Année " + curYear };
    }
    if (MONTH_VIEWS[view]) {
      return {
        from: fmt(curYear, curMonth, 1),
        to: fmt(curYear, curMonth, daysInMonth(curYear, curMonth)),
        title: MONTHS[curMonth] + " " + curYear
      };
    }
    var end = addDays(weekStart, 6);
    return {
      from: fmt(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()),
      to: fmt(end.getFullYear(), end.getMonth(), end.getDate()),
      title: "Semaine du " + weekStart.getDate() + " " + MONTHS_SHORT[weekStart.getMonth()].toLowerCase()
    };
  }

  function sumTable(range) {
    var table = el("table", "sum");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "", range.title));
    TYPES.forEach(function (t) { hr.appendChild(el("th", "", t.short)); });
    hr.appendChild(el("th", "", "W-E travaillés"));
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = el("tbody");
    state.team.forEach(function (n) {
      var c = countRange(n.id, range.from, range.to);
      var tr = el("tr");
      tr.appendChild(el("td", "", n.name));
      TYPES.forEach(function (t) {
        var v = c[t.id] || 0;
        var cls = v === 0 ? "zero" : (NEEDS_COVER[t.id] ? "alert" : "");
        tr.appendChild(el("td", cls, String(v)));
      });
      tr.appendChild(el("td", c.we ? "" : "zero", String(c.we)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function renderSums() {
    var sp = document.getElementById("sum-period");
    var sy = document.getElementById("sum-year");
    sp.textContent = "";
    sy.textContent = "";
    if (!state.team.length) {
      sp.appendChild(el("div", "empty-hint", "Le récap apparaîtra une fois l'équipe créée."));
      sy.appendChild(el("div", "empty-hint", "Le récap apparaîtra une fois l'équipe créée."));
      return;
    }
    sp.appendChild(sumTable(currentRange()));
    // En vue année, le second panneau ferait doublon.
    document.getElementById("year-panel").hidden = (view === "year");
    if (view !== "year") {
      sy.appendChild(sumTable({ from: fmt(curYear, 0, 1), to: fmt(curYear, 11, 31), title: "Année " + curYear }));
    }
  }

  /* ---------- jours sans personne et remplaçants ---------- */

  function longDate(dstr) {
    var q = dstr.split("-");
    var date = new Date(+q[0], +q[1] - 1, +q[2]);
    return DOW_LONG[date.getDay()] + " " + date.getDate() + " " + MONTHS[date.getMonth()].toLowerCase();
  }

  /* Jours de la période affichée où personne de l'équipe ne travaille. */
  function uncoveredDays() {
    var r = currentRange();
    var out = [];
    var from = r.from.split("-"), to = r.to.split("-");
    var d = new Date(+from[0], +from[1] - 1, +from[2]);
    var end = new Date(+to[0], +to[1] - 1, +to[2]);
    while (d <= end) {
      var dstr = fmt(d.getFullYear(), d.getMonth(), d.getDate());
      if (!workersOn(dstr).length) out.push(dstr);
      d = addDays(d, 1);
    }
    return { days: out, title: r.title };
  }

  function setCover(dstr, st) {
    if (!st) delete state.cover[dstr];
    else {
      var cur = state.cover[dstr] || {};
      state.cover[dstr] = { st: st, sub: st === "RB" ? (cur.sub || null) : null };
    }
    markDirty();
    renderGaps();
    renderGrid();
  }

  function assignSub(dstr, subId) {
    var cur = state.cover[dstr] || { st: "RB" };
    state.cover[dstr] = { st: subId ? "RB" : cur.st, sub: subId || null };
    markDirty();
    renderGaps();
    renderGrid();
  }

  function renderGaps() {
    var box = document.getElementById("gaps-body");
    box.textContent = "";
    if (!state.team.length) {
      box.appendChild(el("div", "empty-hint", "Ajoutez d'abord l'équipe."));
      return;
    }
    var u = uncoveredDays();
    var head = el("div", "gapshead");
    var toFind = u.days.filter(function (d) {
      var c = coverOn(d);
      return !c || c.st === "RAT";
    });
    head.appendChild(el("span", "gapscount",
      u.days.length ? u.days.length + " jour" + (u.days.length > 1 ? "s" : "") + " sans personne · " + u.title
                    : "Aucun jour découvert · " + u.title));
    if (toFind.length) {
      var share = el("button", "wabtn", "Partager sur WhatsApp");
      share.addEventListener("click", function () { shareOnWhatsApp(null); });
      head.appendChild(share);
    }
    box.appendChild(head);

    if (!u.days.length) {
      box.appendChild(el("p", "hint-inline", "Toutes les journées de cette période sont assurées par quelqu'un."));
      return;
    }

    var list = el("div", "gaplist");
    u.days.forEach(function (dstr) {
      var c = coverOn(dstr);
      var row = el("div", "gaprow" + (c ? " covered" : ""));
      row.appendChild(el("span", "gapdate", longDate(dstr)));

      var actions = el("span", "gapactions");
      [{ id: "RAT", label: "À trouver" }, { id: "RB", label: "Booké" }].forEach(function (o) {
        var b = el("button", "gapbtn s-" + o.id + ((c && c.st === o.id) ? " on" : ""), o.label);
        b.addEventListener("click", function () {
          setCover(dstr, (c && c.st === o.id) ? null : o.id);
        });
        actions.appendChild(b);
      });

      var sel = el("select", "gapsel");
      sel.setAttribute("aria-label", "Remplaçant pour le " + longDate(dstr));
      var none = el("option", null, state.subs.length ? "— remplaçant —" : "— aucun remplaçant enregistré —");
      none.value = "";
      sel.appendChild(none);
      state.subs.forEach(function (sb) {
        var o = el("option", null, sb.name);
        o.value = sb.id;
        if (c && c.sub === sb.id) o.selected = true;
        sel.appendChild(o);
      });
      sel.disabled = !state.subs.length;
      sel.addEventListener("change", function () { assignSub(dstr, sel.value); });
      actions.appendChild(sel);
      row.appendChild(actions);
      list.appendChild(row);
    });
    box.appendChild(list);
  }

  /* Numéro au format international, sans espaces ni signes. */
  function waNumber(phone) {
    var n = String(phone || "").replace(/[^0-9]/g, "");
    if (!n) return "";
    if (n.indexOf("00") === 0) n = n.slice(2);
    else if (n.charAt(0) === "0") n = "33" + n.slice(1);   // numéro français
    return n;
  }

  function shareText() {
    var u = uncoveredDays();
    var days = u.days.filter(function (d) {
      var c = coverOn(d);
      return !c || c.st === "RAT";
    });
    if (!days.length) return "";
    var lines = ["Bonjour, nous cherchons un remplacement pour :"];
    days.forEach(function (d) { lines.push("• " + longDate(d)); });
    lines.push("");
    lines.push("Merci de me dire vos disponibilités.");
    return lines.join("\n");
  }

  function shareOnWhatsApp(sub) {
    var text = shareText();
    if (!text) { toast("Aucun jour à pourvoir sur cette période."); return; }
    var num = sub ? waNumber(sub.phone) : "";
    if (sub && !num) { toast("Renseignez le numéro de " + sub.name + " dans « Remplaçants »."); return; }
    var url = "https://wa.me/" + num + "?text=" + encodeURIComponent(text);
    window.open(url, "_blank", "noopener");
  }

  function renderSubs() {
    var box = document.getElementById("subs-body");
    box.textContent = "";
    var list = el("div", "teamlist");
    state.subs.forEach(function (sb) {
      var row = el("div", "teamrow");
      var name = el("input");
      name.type = "text";
      name.value = sb.name;
      name.setAttribute("aria-label", "Nom du remplaçant");
      name.addEventListener("change", function () {
        var v = name.value.trim();
        if (!v) { name.value = sb.name; return; }
        sb.name = v;
        markDirty();
        renderGaps();
        renderGrid();
      });
      row.appendChild(name);

      var tel = el("input", "telinput");
      tel.type = "tel";
      tel.value = sb.phone || "";
      tel.placeholder = "06 12 34 56 78";
      tel.setAttribute("aria-label", "Téléphone de " + sb.name);
      tel.addEventListener("change", function () {
        sb.phone = tel.value.trim();
        markDirty();
        renderSubs();
      });
      row.appendChild(tel);

      var wa = el("button", "wabtn small", "WhatsApp");
      wa.title = "Envoyer la liste des jours à pourvoir à " + sb.name;
      wa.addEventListener("click", function () { shareOnWhatsApp(sb); });
      row.appendChild(wa);

      var del = el("button", "del", "Retirer");
      del.dataset.armed = "";
      del.addEventListener("click", function () {
        if (!del.dataset.armed) {
          del.dataset.armed = "1";
          del.textContent = "Retirer " + sb.name + " ? Confirmer";
          setTimeout(function () {
            if (del.isConnected) { del.dataset.armed = ""; del.textContent = "Retirer"; }
          }, 4000);
          return;
        }
        state.subs = state.subs.filter(function (x) { return x.id !== sb.id; });
        Object.keys(state.cover).forEach(function (d) {
          if (state.cover[d].sub === sb.id) state.cover[d].sub = null;
        });
        markDirty();
        renderSubs();
        renderGaps();
        renderGrid();
      });
      row.appendChild(del);
      list.appendChild(row);
    });
    box.appendChild(list);

    var add = el("div", "teamrow");
    var an = el("input");
    an.type = "text";
    an.id = "add-sub-name";
    an.placeholder = "Prénom du remplaçant";
    an.setAttribute("aria-label", "Prénom du remplaçant");
    var at = el("input", "telinput");
    at.type = "tel";
    at.id = "add-sub-tel";
    at.placeholder = "06 12 34 56 78";
    at.setAttribute("aria-label", "Téléphone du remplaçant");
    var ab = el("button", "addbtn", "＋ Ajouter");
    function addSub() {
      var v = an.value.trim();
      if (!v) { an.focus(); return; }
      state.subs.push({ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
                        name: v, phone: at.value.trim() });
      an.value = "";
      at.value = "";
      markDirty();
      renderSubs();
      renderGaps();
      an.focus();
    }
    ab.addEventListener("click", addSub);
    [an, at].forEach(function (inp) {
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); addSub(); }
      });
    });
    add.appendChild(an);
    add.appendChild(at);
    add.appendChild(ab);
    box.appendChild(add);

    if (!state.subs.length) {
      box.appendChild(el("p", "hint-inline",
        "Enregistrez ici les remplaçants et leur numéro : vous pourrez leur envoyer la liste des jours à pourvoir en un clic."));
    }
  }

  /* ---------- équipe ---------- */

  function renderTeam() {
    var list = document.getElementById("teamlist");
    list.textContent = "";
    state.team.forEach(function (n) {
      var row = el("div", "teamrow");
      var input = el("input");
      input.type = "text";
      input.value = n.name;
      input.setAttribute("aria-label", "Nom");
      input.addEventListener("change", function () {
        var v = input.value.trim();
        if (!v) { input.value = n.name; return; }
        var clash = state.team.filter(function (x) {
          return x.id !== n.id && normName(x.name) === normName(v);
        })[0];
        n.name = v;
        if (clash && mergeDuplicateNames()) {
          toast("« " + v + " » existait déjà : les deux plannings ont été fusionnés.");
        }
        markDirty();
        renderAll();
      });
      row.appendChild(input);
      var picker = el("div", "colorpick");
      NURSE_COLORS.forEach(function (c) {
        var b = el("button", n.color === c ? "on" : "");
        b.style.background = c;
        b.setAttribute("aria-label", "Couleur");
        b.addEventListener("click", function () {
          n.color = c;
          markDirty();
          renderTeam();
          renderIdentity();
          renderGrid();
        });
        picker.appendChild(b);
      });
      row.appendChild(picker);
      var mine = el("button", "mebtn" + (me === n.id ? " on" : ""), me === n.id ? "✓ C'est moi" : "C'est moi");
      mine.title = "Mémorisé sur cet appareil uniquement";
      mine.addEventListener("click", function () {
        me = (me === n.id) ? null : n.id;
        lsSet("releve.me", me || "");
        renderTeam();
        renderIdentity();
        renderGrid();
      });
      row.appendChild(mine);
      var del = el("button", "del", "Retirer");
      del.dataset.armed = "";
      del.addEventListener("click", function () {
        if (!del.dataset.armed) {
          del.dataset.armed = "1";
          del.textContent = "Retirer " + n.name + " et son planning ? Confirmer";
          setTimeout(function () {
            if (del.isConnected) { del.dataset.armed = ""; del.textContent = "Retirer"; }
          }, 4000);
          return;
        }
        state.team = state.team.filter(function (x) { return x.id !== n.id; });
        delete state.entries[n.id];
        if (me === n.id) { me = null; lsSet("releve.me", ""); }
        if (focusWho === n.id) { focusWho = ALL; lsSet("releve.focus", ALL); }
        markDirty();
        renderAll();
      });
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function addNurse() {
    var input = document.getElementById("add-name");
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    var n = {
      id: uid(),
      name: name,
      color: NURSE_COLORS[state.team.length % NURSE_COLORS.length]
    };
    state.team.push(n);
    if (!me) { me = n.id; lsSet("releve.me", me); }
    input.value = "";
    markDirty();
    renderAll();
    document.getElementById("team-panel").open = true;
    input.focus();
  }
  document.getElementById("add-nurse").addEventListener("click", addNurse);
  document.getElementById("add-name").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addNurse(); }
  });

  /* ---------- saisie des jours ---------- */

  function applyBrush(td) {
    if (!td || !td.dataset.n) return;
    var nid = td.dataset.n, dstr = td.dataset.d;
    var val = brush === "ERASE" ? null : brush;
    var cur = entryOf(nid, dstr);
    if (cur === val) return;
    if (!state.entries[nid]) state.entries[nid] = {};
    if (val === null) delete state.entries[nid][dstr];
    else state.entries[nid][dstr] = val;
    pending[nid + "|" + dstr] = val;
    ssSet(PENDING_KEY, JSON.stringify(pending));
    paintCellContent(td);
    markDirty();
    scheduleSumRefresh();
  }

  var sumTimer = null;
  function scheduleSumRefresh() {
    clearTimeout(sumTimer);
    sumTimer = setTimeout(function () {
      renderSums();
      renderGaps();
      if (MONTH_VIEWS[view]) renderMonths();
    }, 250);
  }

  var grid = document.getElementById("gridscroll");

  /* Au doigt on peint sur le tap (événement click) et non au contact : sinon
     un simple défilement de la liste marquerait des jours au passage. */
  var touchTap = false;
  grid.addEventListener("pointerdown", function (e) {
    var td = e.target.closest(".cell");
    if (!td) return;
    if (e.pointerType === "touch") { touchTap = true; return; }
    touchTap = false;
    if (e.button === 2) return;
    painting = true;
    applyBrush(td);
  });
  grid.addEventListener("click", function (e) {
    if (!touchTap) return;
    touchTap = false;
    var td = e.target.closest(".cell");
    if (td) applyBrush(td);
  });
  grid.addEventListener("pointerover", function (e) {
    if (!painting || !(e.buttons & 1)) return;
    var td = e.target.closest(".cell");
    if (td) applyBrush(td);
  });
  window.addEventListener("pointerup", function () { painting = false; });
  grid.addEventListener("contextmenu", function (e) {
    var td = e.target.closest(".cell");
    if (!td) return;
    e.preventDefault();
    var old = brush;
    brush = "ERASE";
    applyBrush(td);
    brush = old;
  });
  grid.addEventListener("keydown", function (e) {
    var td = e.target.closest(".cell");
    if (!td) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applyBrush(td); }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      var old = brush;
      brush = "ERASE";
      applyBrush(td);
      brush = old;
    }
  });

  /* ---------- navigation ---------- */

  /* L'en-tête du tableau se colle juste sous l'en-tête de page. */
  function measureStick() {
    var h = narrow.matches
      ? Math.round(document.querySelector("header.top").getBoundingClientRect().height)
      : 0;
    document.documentElement.style.setProperty("--stick", h + "px");
  }
  window.addEventListener("resize", measureStick);
  window.addEventListener("orientationchange", measureStick);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureStick);
  if (window.ResizeObserver) {
    new ResizeObserver(measureStick).observe(document.querySelector("header.top"));
  }

  var wasNarrow = narrow.matches;
  function onWidthChange() {
    if (narrow.matches === wasNarrow) return;
    wasNarrow = narrow.matches;
    measureStick();
    renderGrid();
  }
  if (narrow.addEventListener) narrow.addEventListener("change", onWidthChange);
  else if (narrow.addListener) narrow.addListener(onWidthChange);

  document.getElementById("prev").addEventListener("click", function () { shiftPeriod(-1); });
  document.getElementById("next").addEventListener("click", function () { shiftPeriod(1); });
  document.getElementById("today-btn").addEventListener("click", goToday);
  window.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") shiftPeriod(-1);
    else if (e.key === "ArrowRight") shiftPeriod(1);
  });

  /* ---------- enregistrement partagé ---------- */

  /* Deux modes de synchronisation :
     - Supabase (hébergement classique, ex. GitHub Pages) : config.js définit
       window.RELEVE_CONFIG = { supabaseUrl, supabaseKey } ; enregistrement
       automatique, sans rechargement, et rafraîchissement périodique.
     - Artifact claude.ai : la page publie une nouvelle version d'elle-même. */

  var cfg = window.RELEVE_CONFIG || null;
  var supa = null;
  if (cfg && cfg.supabaseUrl && cfg.supabaseKey) {
    supa = {
      endpoint: String(cfg.supabaseUrl).replace(/\/+$/, "") + "/rest/v1/planning",
      docId: cfg.docId || "main",
      rev: 0,
      headers: {
        apikey: cfg.supabaseKey,
        Authorization: "Bearer " + cfg.supabaseKey,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      }
    };
  }

  var AUTOSAVE_MS = 2500;
  var autosaveTimer = null;
  function scheduleAutosave() {
    if (!supa || readOnly) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(save, AUTOSAVE_MS);
  }

  function markDirty() {
    dirty = true;
    updateSaveStatus();
    scheduleAutosave();
  }

  function updateSaveStatus() {
    var st = document.getElementById("save-status");
    var btn = document.getElementById("save-btn");
    if (readOnly) {
      st.textContent = "Lecture seule";
      st.classList.remove("dirty");
      btn.disabled = true;
      return;
    }
    if (saving) {
      st.textContent = "Enregistrement…";
      st.classList.remove("dirty");
      btn.disabled = true;
      return;
    }
    if (dirty) {
      st.textContent = narrow.matches ? "Non enregistré" : "Modifications non enregistrées";
      st.classList.add("dirty");
      btn.disabled = false;
    } else {
      st.textContent = "Enregistré";
      st.classList.remove("dirty");
      btn.disabled = true;
    }
  }

  function supaReq(method, qs, body) {
    return fetch(supa.endpoint + qs, {
      method: method,
      headers: supa.headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function adoptServer(row, initial) {
    supa.rev = row.rev || 0;
    if (row.data && typeof row.data === "object") state = row.data;
    normalizeState();
    var changed = migrateStatuses();
    if (applySeed()) changed = true;
    if (applyMonthPlans()) changed = true;
    if (mergeDuplicateNames()) changed = true;
    if (me && !state.team.some(function (n) { return n.id === me; })) { me = null; lsSet("releve.me", ""); }
    if (applyPendingToState() || changed) {
      dirty = true;
      scheduleAutosave();
    } else {
      pending = {};
      ssDel(PENDING_KEY);
      dirty = false;
    }
    if (initial) pickInitialYear();
    renderAll();
  }

  function supaPoll() {
    if (!supa || painting || saving) return;
    supaReq("GET", "?id=eq." + supa.docId + "&select=rev,data")
      .then(function (rows) {
        if (rows.length && (rows[0].rev || 0) > supa.rev) adoptServer(rows[0]);
      })
      .catch(function () { /* hors ligne : nouvelle tentative au prochain cycle */ });
  }

  function supaInit() {
    supaReq("GET", "?id=eq." + supa.docId + "&select=rev,data")
      .then(function (rows) {
        if (rows.length) { adoptServer(rows[0], true); return; }
        // Première ouverture : on crée le document partagé de l'équipe.
        return supaReq("POST", "", { id: supa.docId, rev: 0, data: state })
          .then(function (created) { if (created.length) supa.rev = created[0].rev || 0; })
          .catch(function () { /* une collègue l'a créé en même temps */ });
      })
      .catch(function () {
        var b = document.getElementById("banner");
        b.textContent = "Impossible de joindre la synchronisation pour l'instant : vos modifications restent sur cet appareil et repartiront dès que la connexion revient.";
        b.classList.add("show");
      });
    setInterval(supaPoll, 30000);
    window.addEventListener("focus", supaPoll);
  }

  function supaSave(attempt) {
    supaReq("PATCH", "?id=eq." + supa.docId + "&rev=eq." + supa.rev,
      { rev: supa.rev + 1, data: state, updated_at: new Date().toISOString() })
      .then(function (rows) {
        if (rows.length) {
          supa.rev = rows[0].rev || (supa.rev + 1);
          pending = {};
          ssDel(PENDING_KEY);
          dirty = false;
          saving = false;
          updateSaveStatus();
          return;
        }
        // Quelqu'un a enregistré entre-temps : on reprend sa version,
        // on rejoue nos modifications par-dessus, puis on réessaie.
        return supaReq("GET", "?id=eq." + supa.docId + "&select=rev,data")
          .then(function (rows2) {
            saving = false;
            if (rows2.length) adoptServer(rows2[0]);
            if (dirty && attempt < 3) {
              saving = true;
              updateSaveStatus();
              return supaSave(attempt + 1);
            }
            updateSaveStatus();
          });
      })
      .catch(function () {
        saving = false;
        updateSaveStatus();
        toast("Enregistrement impossible : vérifiez la connexion. Nouvel essai automatique.");
        scheduleAutosave();
      });
  }

  var artifactReady = (!supa && window.claude && window.claude.use)
    ? window.claude.use("artifact")
    : Promise.resolve(null);

  if (!supa) {
    artifactReady.then(function (ns) {
      if (!ns) {
        var b = document.getElementById("banner");
        b.textContent = "Synchronisation non configurée : les modifications restent locales à ce navigateur et ne seront pas partagées avec l'équipe.";
        b.classList.add("show");
      }
    });
  }

  function serializeState() {
    return JSON.stringify(state).replace(/</g, "\\u003c");
  }

  function buildDocument(src) {
    var OPEN = "<!--RELEVE-STATE-->";
    var CLOSE = "<!--/RELEVE-STATE-->";
    var a = src.indexOf(OPEN);
    var b = src.indexOf(CLOSE);
    if (a < 0 || b < 0 || b < a) return null;
    return src.slice(0, a) + OPEN +
      '\n<script type="application/json" id="' + STATE_EL_ID + '">' +
      serializeState() +
      "<\/script>\n" + CLOSE + src.slice(b + CLOSE.length);
  }

  function save() {
    if (saving || readOnly || !dirty) return;
    saving = true;
    updateSaveStatus();
    if (supa) { supaSave(1); return; }
    artifactReady.then(function (ns) {
      if (!ns) {
        saving = false;
        updateSaveStatus();
        toast("Enregistrement partagé indisponible ici.");
        return;
      }
      fetch(location.href, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("source");
          return r.text();
        })
        .then(function (src) {
          var doc = buildDocument(src);
          if (!doc) throw new Error("source");
          return ns.publish(doc);
        })
        .then(function () {
          ssDel(PENDING_KEY);
          dirty = false;
          saving = false;
          updateSaveStatus();
        })
        .catch(function (err) {
          saving = false;
          var code = err && err.code;
          if (code === "conflict") {
            toast("Quelqu'un vient d'enregistrer : rechargement, vos modifications seront réappliquées.");
            return;
          }
          if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared") {
            readOnly = true;
            updateSaveStatus();
            var b = document.getElementById("banner");
            b.textContent = "Vous consultez ce planning en lecture seule. Demandez un accès « modification » pour enregistrer vos jours.";
            b.classList.add("show");
            return;
          }
          if (code === "rate_limited") {
            updateSaveStatus();
            toast("Enregistrements trop rapprochés : réessayez dans quelques secondes.");
            return;
          }
          updateSaveStatus();
          toast("Échec de l'enregistrement : vérifiez la connexion puis réessayez.");
        });
    });
  }

  document.getElementById("save-btn").addEventListener("click", save);
  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  });
  window.addEventListener("beforeunload", function (e) {
    if (dirty && !saving && !readOnly) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ---------- application installable ---------- */

  if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* hors ligne indisponible : l'application reste utilisable en ligne */
      });
    });
  }

  /* Sur iPhone, l'installation passe par le menu Partager de Safari. */
  (function installHint() {
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone || lsGet("releve.hideInstall")) return;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (!ios) return;
    var hint = el("p", "install-hint");
    hint.appendChild(document.createTextNode("Pour l'ajouter à votre écran d'accueil : Partager puis « Sur l'écran d'accueil »."));
    var close = el("button", "iconbtn", "✕");
    close.style.cssText = "width:24px;height:24px;margin-left:8px;vertical-align:middle";
    close.setAttribute("aria-label", "Masquer ce conseil");
    close.addEventListener("click", function () {
      lsSet("releve.hideInstall", "1");
      hint.remove();
    });
    hint.appendChild(close);
    document.querySelector(".wrap").appendChild(hint);
  })();

  /* ---------- démarrage ---------- */

  function renderAll() {
    renderViewSwitch();
    renderPeriod();
    renderMonths();
    renderIdentity();
    renderPalette();
    renderGrid();
    renderSums();
    renderGaps();
    renderSubs();
    renderTeam();
    updateSaveStatus();
  }

  var changedAtStart = migrateStatuses();
  if (applySeed()) changedAtStart = true;
  if (applyMonthPlans()) changedAtStart = true;
  if (mergeDuplicateNames()) changedAtStart = true;
  if (changedAtStart) dirty = true;
  pickInitialYear();
  renderAll();
  measureStick();
  if (supa) supaInit();
  if (dirty) {
    if (supa) scheduleAutosave();
    else toast("Planning mis à jour : cliquez sur Enregistrer pour le partager.");
  }
})();
</script>
</body>
</html>
